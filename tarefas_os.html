<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarefas - Ganso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Firebase (compat) -->
<script>window.__fbFail=false;</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" onerror="window.__fbFail=true"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js" onerror="window.__fbFail=true"></script>

<style>
:root{
  --bg:#eef3f2; --surface:#ffffff; --surface-2:#f6f9f8; --line:#dde6e4;
  --ink:#142624; --muted:#647a77; --muted-2:#90a3a0;
  --primary:#0e6e6e; --primary-deep:#0a4f4f; --primary-soft:#dbeceb;
  --accent:#e8744f; --accent-soft:#fbe6dd;
  --ok:#2f9e6b; --ok-soft:#dcf0e6;
  --warn:#d98a1f;
  --continua:#6a5acd; --continua-soft:#ecebfb; --continua-deep:#4a3fa0;
  --demanda:#c98a12; --demanda-soft:#fbf0d8; --demanda-deep:#8a5d0c;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(16,40,38,.06),0 6px 20px -8px rgba(16,40,38,.18);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
.hidden{display:none !important}

/* ---------- Layout ---------- */
.app{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header.bar{position:sticky;top:0;z-index:20;background:var(--primary-deep);color:#eafcfb;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;box-shadow:var(--shadow)}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:18px}
.brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#34c0b6,#0e6e6e);
  display:grid;place-items:center;font-size:13px}
.who{font-size:12.5px;color:#bfe6e3;text-align:right;line-height:1.25}
.who b{color:#eafcfb;font-weight:600}
.iconbtn{background:rgba(255,255,255,.12);border:0;color:#eafcfb;border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:transparent;border:0;color:#a9dad6;padding:11px 14px;font-weight:600;font-size:14px;
  white-space:nowrap;border-bottom:3px solid transparent;border-radius:8px 8px 0 0}
.tab.active{color:#fff;border-bottom-color:var(--accent)}
main{flex:1;padding:18px 16px 110px;min-width:0}

/* ---------- Generic ---------- */
.section-title{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
.section-title:first-child{margin-top:4px}
.count-pill{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:999px;
  font-size:11px;padding:1px 8px;font-weight:700;letter-spacing:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:22px 18px;
  text-align:center;color:var(--muted);font-size:14px}
.empty b{color:var(--ink);display:block;margin-bottom:3px;font-size:15px}

/* ---------- Cabeçalhos de bloco do dia (Minhas tarefas) ---------- */
.day-block-head{display:flex;align-items:center;gap:12px;margin:26px 2px 12px;padding:0}
.day-block-head:first-of-type{margin-top:4px}
.day-block-icon{flex:0 0 auto;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px}
.day-block-text{flex:1;min-width:0}
.day-block-title{font-size:15.5px;font-weight:800;letter-spacing:-.01em;color:var(--ink);line-height:1.2}
.day-block-sub{font-size:12px;color:var(--muted);margin-top:1px}
.day-block-head.t-continua .day-block-icon{background:var(--continua-soft);color:var(--continua-deep)}
.day-block-head.t-demanda .day-block-icon{background:var(--demanda-soft);color:var(--demanda-deep)}
.day-block-head.t-executar .day-block-icon{background:var(--primary-soft);color:var(--primary-deep)}
.day-block-head.t-late .day-block-icon{background:var(--accent-soft);color:#b24722}
.day-block-head.t-done .day-block-icon{background:var(--ok-soft);color:#1d7a4f}

/* ---------- Task card ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  margin-bottom:12px;overflow:hidden;position:relative}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--muted-2)}
.card.late::before{background:var(--accent)}

/* Preocupação contínua: visual "ambiente", convida a manter em mente, não a agir */
.card.v-continua{background:linear-gradient(135deg,var(--continua-soft) 0%,var(--surface) 55%);
  border-color:#d9d5f3;box-shadow:none}
.card.v-continua::before{background:var(--continua);width:4px}

/* Sob demanda: mesma linguagem visual (cor + fade), com a cor própria da natureza */
.card.v-demanda{background:linear-gradient(135deg,var(--demanda-soft) 0%,var(--surface) 55%);
  border-color:#ecdbb0;box-shadow:none}
.card.v-demanda::before{background:var(--demanda);width:4px}

.card-body{padding:14px 16px 14px 18px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-head-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.btn-suggest{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;
  padding:4px 9px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.btn-suggest:hover{border-color:var(--primary);color:var(--primary-deep)}
.btn-suggest.has-open{border-color:var(--accent);color:#b24722;background:var(--accent-soft)}
.card h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.card .desc{color:var(--muted);font-size:13.5px;margin:5px 0 0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.chip.sector{background:var(--primary-soft);border-color:transparent;color:var(--primary-deep)}
.chip.r{background:#ecebfb;border-color:transparent;color:#4a45a8}
.chip.time{background:#eef6ff;border-color:transparent;color:#2b6cb0}
.chip.late{background:var(--accent-soft);border-color:transparent;color:#b24722}
.chip.transferred{background:#fff4e6;border-color:transparent;color:#a8651a}
.status{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.status.pendente{background:var(--surface-2);color:var(--muted)}
.status.aberta{background:var(--surface-2);color:var(--muted)}
.status.em_andamento{background:#e7f0ff;color:#2b6cb0}
.status.concluida{background:var(--ok-soft);color:#1d7a4f}
.status.adiada{background:#f0ecff;color:#6a5acd}
.status.nao_realizada{background:#f3e3e0;color:#8a3b2a}
.status.cancelada{background:#f3e3e0;color:#8a3b2a}
.assignee{font-size:13px;color:var(--muted);margin-top:9px}
.assignee b{color:var(--ink);font-weight:600}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;
  padding:9px 14px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;transition:.12s}
.btn:hover{border-color:var(--muted-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-deep)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{filter:brightness(.95)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:12.5px}
.btn.full{width:100%;justify-content:center}
.btn.danger{color:#b8311a;border-color:#f0c8c0}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- Login ---------- */
.login-wrap{min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(120% 80% at 50% 0%,#0e6e6e 0%,#0a4f4f 55%,#073c3c 100%)}
.login{width:100%;max-width:380px;background:var(--surface);border-radius:20px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);
  padding:30px 26px}
.login .logo{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,#34c0b6,#0e6e6e);
  display:grid;place-items:center;font-size:26px;margin-bottom:16px}
.login h1{margin:0;font-size:22px;letter-spacing:-.02em}
.login p.sub{margin:4px 0 22px;color:var(--muted);font-size:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);
  border-radius:11px;background:var(--surface-2);outline:none;transition:.12s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);background:#fff;
  box-shadow:0 0 0 3px var(--primary-soft)}
.field textarea{min-height:74px;resize:vertical}
.login .btn.primary{width:100%;justify-content:center;padding:13px;font-size:15px;margin-top:6px}
.error-msg{background:var(--accent-soft);color:#a8341f;border-radius:10px;padding:10px 12px;font-size:13px;
  font-weight:500;margin-bottom:14px}
.linkbtn{display:block;width:100%;text-align:center;background:none;border:0;color:var(--primary);
  font-size:13px;font-weight:600;margin-top:12px;padding:4px;text-decoration:underline}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:6px;padding:2px 6px;word-break:break-all}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,30,28,.55);backdrop-filter:blur(2px);z-index:60;
  display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90dvh;overflow:auto;
  border-radius:18px;padding:22px 22px 20px;box-shadow:0 24px 70px -20px rgba(0,0,0,.55);
  animation:popIn .18s ease}
@keyframes popIn{from{transform:translateY(10px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet-head h2{margin:0;font-size:19px;letter-spacing:-.01em}
.x{background:var(--surface-2);border:0;width:34px;height:34px;border-radius:9px;font-size:18px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* opções selecionáveis (transferir) */
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface-2);
  border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;transition:.12s;font:inherit;color:inherit;cursor:pointer}
.opt:hover:not(.disabled){border-color:var(--muted-2)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.disabled{opacity:.55;cursor:not-allowed}
.opt .rlevel{background:#ecebfb;color:#4a45a8;font-weight:700;font-size:12px;border-radius:7px;padding:2px 8px;flex:0 0 auto}
.opt-main{flex:1;display:flex;flex-direction:column;line-height:1.25;min-width:0}
.opt-name{font-weight:600;font-size:14.5px}
.opt-check{color:var(--primary);font-size:18px;width:18px;text-align:center;flex:0 0 auto}
.sheet-actions{display:flex;gap:10px;margin-top:22px;position:sticky;bottom:-20px;background:var(--surface);
  padding-top:8px}
.sheet-actions .btn{flex:1;justify-content:center;padding:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;
  padding:10px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.wd-row{display:flex;gap:6px;flex-wrap:wrap}
.wd-btn{flex:1;min-width:42px;padding:9px 4px;border:1px solid var(--line);background:var(--surface-2);
  border-radius:10px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}
.wd-btn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.wd-presets{display:flex;gap:8px;margin-top:8px}

/* responsibles picker */
.resp-list{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.resp-item{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:10px;padding:8px 8px 8px 11px}
.resp-item .rlevel{background:#ecebfb;color:#4a45a8;font-weight:700;font-size:12px;border-radius:7px;
  padding:2px 8px;flex:0 0 auto}
.resp-item .rname{flex:1;font-size:14px;font-weight:500}
.resp-item .rname-edit{flex:1;font-size:14px;font-weight:500;border:none;background:transparent;padding:2px 0;color:var(--ink);font-family:inherit}
.resp-item .rname-edit:focus{outline:none;border-bottom:1.5px solid var(--primary)}
.resp-item .ord{display:flex;flex-direction:column;gap:2px}
.miniicon{background:#fff;border:1px solid var(--line);border-radius:7px;width:30px;height:26px;
  display:grid;place-items:center;font-size:13px;color:var(--muted);padding:0}
.miniicon.rm{color:#b8311a}
.add-resp{display:flex;gap:8px;margin-top:8px}
.add-resp select{flex:1}
.combo{position:relative}
.combo-input-wrap{position:relative}
.combo-input-wrap input{width:100%;padding:9px 11px 9px 30px;border:1px solid var(--line);border-radius:10px;
  font-size:13.5px;font-family:inherit;background:#fff}
.combo-input-wrap input:focus{outline:none;border-color:var(--primary)}
.emp-picker-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.55;pointer-events:none}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:60;background:#fff;
  border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.14);
  max-height:230px;overflow-y:auto;padding:6px}
.combo-list.hidden{display:none}
.combo-opt{display:block;width:100%;text-align:left;background:none;border:none;border-radius:8px;
  padding:10px 11px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;font-family:inherit}
.combo-opt:hover{background:var(--surface-2)}
.combo-opt.reset{color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:4px;padding-bottom:10px}
.combo-empty{padding:10px 11px;font-size:13px;color:var(--muted)}
.add-resp .combo,.filters .combo{flex:1;min-width:150px}
.note{font-size:12px;color:var(--muted);margin-top:7px}

/* admin task list */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:13px 15px;margin-bottom:10px}
.tcard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tcard h3{margin:0;font-size:15.5px;font-weight:700}
.tcard .small{font-size:12.5px;color:var(--muted);margin-top:3px}
.tcard .actions{margin-top:10px}
.fab{position:fixed;right:max(16px,calc(50% - 380px + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  background:var(--primary);color:#fff;border:0;border-radius:16px;padding:14px 18px;font-weight:700;font-size:15px;
  box-shadow:0 10px 24px -6px rgba(14,110,110,.6);z-index:30;display:flex;align-items:center;gap:8px}

/* diagnostics */
.diag{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;overflow-x:auto}
.diag h4{margin:0 0 8px;font-size:14px}
table.diag-t{width:100%;border-collapse:collapse;font-size:12.5px}
table.diag-t th,table.diag-t td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.diag-t th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.tag-ok{color:#1d7a4f;font-weight:700}
.tag-no{color:#b24722;font-weight:700}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.kv span{color:var(--muted)} .kv b{color:var(--ink)}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin:2px 2px 6px}
.date-nav{display:flex;gap:6px;overflow-x:auto;margin:2px 2px 14px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.date-nav::-webkit-scrollbar{display:none}
.date-chip{flex:0 0 auto;padding:8px 13px;border:1px solid var(--line);border-radius:20px;background:#fff;
  font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer}
.date-chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.filters select{flex:1;min-width:150px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);font-size:13px;color:var(--ink);box-shadow:var(--shadow)}
.filters .btn{flex:0 0 auto}
.today-row{display:flex;align-items:center;gap:10px;background:var(--primary-soft);border-radius:11px;padding:9px 11px;margin-top:11px}
.today-row.none{background:var(--accent-soft)}
.today-row.muted{background:var(--surface-2);padding:8px 11px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;
  font-weight:700;font-size:15px;flex:0 0 auto}
.avatar.none{background:var(--accent)}
.today-info{flex:1;display:flex;flex-direction:column;line-height:1.2;min-width:0}
.today-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--primary-deep);opacity:.85}
.today-row.none .today-label{color:#b24722}
.today-name{font-size:15px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- Painel "Minhas responsabilidades" ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.stat-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--shadow);
  padding:14px 14px 12px;text-align:center}
.stat-box .num{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--primary-deep);line-height:1.1}
.stat-box .lbl{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px}
.stat-box.r1 .num{color:var(--primary-deep)}
.stat-box.r2 .num{color:#6a5acd}
.stat-box.r3 .num{color:var(--accent)}

/* ---------- Card de nota semanal (colaborador) ---------- */
.score-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px 18px;margin-bottom:18px;text-align:center}
.score-num{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
.score-num.good{color:var(--ok)}
.score-num.mid{color:var(--demanda-deep)}
.score-num.bad{color:#c0392b}
.score-num.none{color:var(--muted-2);font-size:28px}
.score-label{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}
.score-period{font-size:11.5px;color:var(--muted-2);margin-top:2px}
.score-trend{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:12.5px;font-weight:700;
  padding:3px 10px;border-radius:999px}
.score-trend.up{background:var(--ok-soft);color:#1d7a4f}
.score-trend.down{background:#fbe1dc;color:#a8341f}
.score-trend.flat{background:var(--surface-2);color:var(--muted)}
.score-history{display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.score-history .wk{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:38px}
.score-history .wk .bar{width:18px;height:36px;background:var(--surface-2);border-radius:4px;position:relative;overflow:hidden}
.score-history .wk .bar .fill{position:absolute;bottom:0;left:0;right:0;border-radius:4px}
.score-history .wk .pct{font-size:10px;color:var(--muted);font-weight:700}

/* ---------- Desempenho da equipe (gestor) ---------- */
.perf-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:11px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.perf-row .pname{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.perf-row .psub{font-size:11.5px;color:var(--muted);margin-top:1px}
.perf-pct{flex:0 0 auto;font-size:14.5px;font-weight:800;min-width:44px;text-align:right}
.perf-pct.good{color:var(--ok)}.perf-pct.mid{color:var(--demanda-deep)}.perf-pct.bad{color:#c0392b}.perf-pct.none{color:var(--muted-2);font-size:13px}
.alert-card{display:flex;align-items:flex-start;gap:10px;border-radius:12px;padding:11px 13px;margin-bottom:8px;font-size:13px}
.alert-card.down{background:#fbe1dc;color:#7a2818}
.alert-card.up{background:var(--ok-soft);color:#175c3f}
.alert-card b{display:block;font-size:13.5px;margin-bottom:1px}

/* Caixa de ranking: uma única caixa com rolagem interna, linhas finas (não cards empilhados) */
.rank-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.rank-box-head{display:flex;align-items:baseline;justify-content:space-between;padding:13px 15px 9px}
.rank-box-head h4{margin:0;font-size:14px;font-weight:800}
.rank-box-head span{font-size:11px;color:var(--muted)}
.rank-scroll{max-height:268px;overflow-y:auto;border-top:1px solid var(--line)}
.rank-line{display:flex;align-items:center;gap:10px;padding:9px 15px;border-bottom:1px solid var(--line);
  width:100%;text-align:left;background:none;cursor:pointer}
.rank-line:last-child{border-bottom:0}
.rank-line:hover{background:var(--surface-2)}
.rank-pos{flex:0 0 auto;width:20px;text-align:center;font-weight:800;font-size:12.5px;color:var(--muted-2)}
.rank-pos.top{color:var(--demanda-deep)}
.rank-main{flex:1;min-width:0}
.rank-name{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.rank-sub{font-size:11px;color:var(--muted)}
.period-bar{display:flex;gap:6px;flex-wrap:wrap;margin:2px 2px 12px}
.period-bar button{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--muted)}
.period-bar button.on{background:var(--primary);border-color:var(--primary);color:#fff}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .blabel{flex:0 0 108px;font-size:13px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),#34c0b6)}
.bar-pct{flex:0 0 42px;text-align:right;font-size:12.5px;font-weight:700;color:var(--muted)}

.partner-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
.partner-line{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:6px 8px 6px 12px;cursor:pointer;font-size:13px;max-width:100%}
.partner-line:hover{border-color:var(--primary)}
.partner-line-name{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.partner-line-count{background:var(--primary-soft);color:var(--primary-deep);border-radius:999px;
  font-size:11.5px;font-weight:700;padding:1px 8px;flex:0 0 auto}

.resp-task-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow)}
.resp-task-row .rlevelbig{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:#ecebfb;color:#4a45a8;
  font-weight:800;font-size:13px;display:grid;place-items:center}
.resp-task-row .rmain{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.resp-task-row .rtitle{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resp-task-row .rmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

/* ---------- Sugestões / tickets ---------- */
.ticket-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);width:100%;text-align:left;cursor:pointer}
.ticket-row .tmain{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3;gap:3px}
.ticket-row .ttitle{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticket-row .tpreview{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticket-row .tmeta{font-size:11px;color:var(--muted-2);margin-top:2px}
.status.ticket-aberto{background:var(--accent-soft);color:#b24722}
.status.ticket-fechado{background:var(--ok-soft);color:#1d7a4f}
.status.ticket-inativo{background:var(--surface-2);color:var(--muted)}
.badge-dot,.tab-dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#e5342b;
  margin-left:6px;vertical-align:middle;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(229,52,43,.35)}
.tab-dot{vertical-align:top;margin-left:4px}
.chat{display:flex;flex-direction:column;gap:10px;margin:6px 0 14px;max-height:340px;overflow-y:auto;padding-right:2px}
.bubble{max-width:82%;padding:9px 12px;border-radius:13px;font-size:13.5px;line-height:1.4}
.bubble.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.bubble.other{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble .bwho{font-size:10.5px;font-weight:700;opacity:.75;display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.03em}
.bubble .bwhen{font-size:10px;opacity:.6;display:block;margin-top:4px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);
  color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;z-index:90;opacity:0;
  transition:.25s;box-shadow:var(--shadow);max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}
.spinner{width:30px;height:30px;border:3px solid var(--primary-soft);border-top-color:var(--primary);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- Ajustes para telas estreitas ---------- */
@media (max-width:480px){
  main{padding:16px 12px 110px}
  header.bar{padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0}
  .brand{font-size:16px}
  .who{font-size:11.5px}
  .row2{grid-template-columns:1fr;gap:10px} /* empilha setor/horário, intervalo/dia etc */
  .add-resp{flex-direction:column}
  .add-resp select,.add-resp button,.add-resp .combo{width:100%}
  .card-body{padding:12px 13px 12px 16px}
  .card h3{font-size:15px}
  .sheet{padding:18px 16px 18px;border-radius:16px;max-width:none;width:calc(100% - 8px)}
  .sheet-actions{flex-direction:column-reverse;gap:8px}
  .sheet-actions .btn{width:100%}
  .actions{gap:6px}
  .btn.sm{padding:8px 12px;font-size:13px}
  .filters select{min-width:0;flex:1 1 calc(50% - 4px)}
  .filters .combo{min-width:0;flex:1 1 calc(50% - 4px)}
  .fab{right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:13px 16px;font-size:14px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .resp-task-row,.tcard{padding:11px 12px}
  .partner-line-name{max-width:120px}
  table.diag-t{font-size:11.5px}
  table.diag-t th,table.diag-t td{padding:5px 6px}
}

<script>
"use strict";

/* ===================================================================
   1) CONFIG DO FIREBASE
   Use a MESMA config do seu escala.html. Para o Realtime Database o
   campo essencial é databaseURL; os outros podem ficar como estão.
   =================================================================== */
const firebaseConfig = {
  apiKey: "",                                   // cole a do escala.html se houver
  authDomain: "escala-fb8b7.firebaseapp.com",
  databaseURL: "https://escala-fb8b7-default-rtdb.firebaseio.com",
  projectId: "escala-fb8b7"
};
const FB_OK = (typeof firebase !== "undefined") && !window.__fbFail;
let db = null;
const dbRef = p => db.ref(p);
if (FB_OK) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
}

/* Caminhos */
const PATH = {
  escala: "escala_lazer/data",   // somente leitura
  users:  "escala_users",        // login
  tarefas:"escala_tarefas"       // leitura+escrita (novo)
};

/* ===================================================================
   2) ADAPTADOR DE SCHEMA  ← AJUSTE AQUI se algum campo tiver outro nome
   Tudo que depende do formato exato da sua escala vive neste bloco.
   =================================================================== */
const SCHEMA = {
  // possíveis nomes de campos dentro de um shiftType / célula de escala
  startTimeFields: ["startTime","start","inicio","horaInicio","entrada","horarioInicio"],
  endTimeFields:   ["endTime","end","fim","horaFim","saida","horarioFim"],
  nameFields:      ["name","nome","label","abbr","sigla","title"],
  // referência ao tipo de turno dentro de uma célula de escala (quando é objeto)
  shiftRefFields:  ["shiftTypeId","shiftType","shiftId","type","tipo","turno","shift"],
  // nomes de empregado
  employeeNameFields: ["name","nome","label","fullName"],
  // nomes que representam AUSÊNCIA (folga/férias/falta/afastado etc.)
  absenceNames: ["folga","feria","ferias","falta","afastad","atestado","licenc","ausente","off","f","dispensa"],
  // flags booleanas que marcam ausência numa célula/shiftType
  absenceFlagFields: ["isAbsence","absence","folga","ausencia","off"],
  // campo de CPF no cadastro de funcionário (login do colaborador)
  cpfFields: ["cpf","CPF","documento","doc","cpfFuncionario","cpf_funcionario"],
  // campo de setor/departamento no cadastro do funcionário (usado p/ liberar quem pode abrir O.S.)
  employeeSectorFields: ["setor","sector","setorId","sectorId","departamento"]
};

/* Login do gestor: digite esta palavra no campo de CPF para entrar como gestor.
   GESTOR_PIN vazio = sem senha (entra direto). Defina um PIN aqui para exigir senha. */
const GESTOR_KEYWORD = "gestor";
const GESTOR_PIN = "";

/* Nome do setor (cadastro do colaborador) que libera abrir/ver Ordens de Serviço, além do gestor. */
const LIDERANCA_SETOR = "Lideranças";
const OS_PRIORITIES = {urgente:"Urgente",normal:"Normal",programada:"Programada"};
/* discussão de tarefa/O.S. sem mensagem nova há esse tanto de dias vira "inativa" automaticamente (some do filtro padrão) */
const DISCUSSION_INACTIVE_DAYS = 7;
const DISCUSSION_INACTIVE_MS = DISCUSSION_INACTIVE_DAYS*24*60*60*1000;

const LOOKBACK_DAYS = 30;       // quantos dias para trás materializar/cobrar atrasos
/* Teto de criação retroativa: quantos dias para trás o app pode CRIAR ocorrências que faltam.
   Serve para o caso normal de ninguém abrir o app por um ou dois dias. Acima disso, criar
   pendências no passado só produz "atrasos" fantasmas que ninguém pode mais executar. */
const MAX_BACKFILL_DAYS = 2;
const WEEKDAYS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

/* ===================================================================
   3) ESTADO
   =================================================================== */
let ESCALA = null;              // /escala_lazer/data
let USERS  = null;              // /escala_users (carregado no login)
let TASKS  = {};                // /escala_tarefas/tasks
let INSTANCES = {};             // /escala_tarefas/instances
let TICKETS = {};               // /escala_tarefas/tickets (sugestões/dúvidas sobre a tarefa)
let WEEKLY_SCORES = {};         // /escala_tarefas/weeklyScores/{empCpf}/{mondayKey} (notas semanais fechadas)
let SCORE_RESET_AT = null;      // /escala_tarefas/scoreResetAt — instâncias anteriores a esta data não contam na nota
let SERVICE_ORDERS = {};        // /escala_tarefas/serviceOrders/{osid} (O.S. — pontuais, sem recorrência)
let DISCUSSIONS = {};           // /escala_tarefas/discussions/{task_<id>|os_<id>} (chat único por tarefa/O.S.)
let state = { user:null, emp:null, admin:false, view:"mine", ready:false, adminFilter:{sector:"",emp:"",status:"",nature:"",level:""}, respFilter:{sector:"",level:""}, perfFilter:{sector:"",emp:"",weeks:4}, osFilter:{status:"",priority:"",sector:""}, discFilter:"active", mineOffset:0, teamFilter:{sector:"",emp:""} };
let materializing = false;
/* maior número de instâncias já visto nesta sessão — usado como referência para detectar
   snapshots degradados antes de materializar (ver trava em materialize()) */
let _maxInstancesSeen = 0;

/* ===================================================================
   4) UTILIDADES
   =================================================================== */
function $(s,r=document){return r.querySelector(s)}
function el(tag,attrs={},html){const e=document.createElement(tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(html!=null)e.innerHTML=html;return e}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function norm(s){return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim()}
function genId(p){return p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2200)}

/* datas em chave YYYY-MM-DD (local) */
function dateKey(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),a=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${a}`}
function todayKey(){return dateKey(new Date())}
function parseKey(k){const[y,m,d]=String(k).split("-").map(Number);return new Date(y,m-1,d)}
function addDays(k,n){const d=parseKey(k);d.setDate(d.getDate()+n);return dateKey(d)}
function weekdayOf(k){return parseKey(k).getDay()}
/* segunda-feira da semana (seg→dom) que contém dKey; usada como identificador único da semana */
function mondayOf(dKey){const wd=weekdayOf(dKey);const diff=wd===0?-6:1-wd;return addDays(dKey,diff)}
function sundayOf(dKey){return addDays(mondayOf(dKey),6)}
function weekLabel(mondayKey){const d=parseKey(mondayKey);const end=parseKey(sundayOf(mondayKey));
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")} – ${String(end.getDate()).padStart(2,"0")}/${String(end.getMonth()+1).padStart(2,"0")}`}
function maxKey(a,b){return a>=b?a:b}
function fmtDate(k){const d=parseKey(k);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})}

/* horários "HH:MM" → minutos */
function timeToMin(t){if(t==null||t==="")return null;const m=String(t).match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null}
function withinShift(taskT,startT,endT){
  const tt=timeToMin(taskT),s=timeToMin(startT),e=timeToMin(endT);
  if(s==null||e==null)return false;          // sem faixa de turno → não dá pra validar
  if(tt==null)return true;                    // tarefa sem horário → condição não se aplica
  if(e>=s)return tt>=s&&tt<=e;                 // turno normal
  return tt>=s||tt<=e;                         // turno que vira a meia-noite
}

/* SHA-256 hex (Web Crypto) */
/* normaliza map OU array do Firebase → array de objetos com id/_key */
function toArray(coll){
  if(!coll)return [];
  if(Array.isArray(coll))return coll.map((v,i)=>v&&typeof v==="object"?{id:v.id!=null?v.id:String(i),_key:String(i),...v}:{id:String(i),_key:String(i),value:v}).filter(x=>x.value!==undefined||x.id!=null);
  return Object.entries(coll).map(([k,v])=>v&&typeof v==="object"?{id:v.id!=null?v.id:k,_key:k,...v}:{id:k,_key:k,value:v});
}
function pick(o,fields){if(!o||typeof o!=="object")return null;for(const f of fields)if(o[f]!=null&&o[f]!=="")return o[f];return null}

/* ===================================================================
   5) ACESSO À ESCALA  (presença / elegibilidade)
   =================================================================== */
function employees(){return toArray(ESCALA&&ESCALA.employees)}
function sectors(){return toArray(ESCALA&&ESCALA.sectors)}
function shiftTypes(){return toArray(ESCALA&&ESCALA.shiftTypes)}

function empName(emp){return emp?(pick(emp,SCHEMA.employeeNameFields)||emp._key||emp.id):"—"}
/* combobox de colaborador: clique/foco abre a lista, digitar filtra ao vivo, clicar escolhe.
   mode "add" (Responsáveis de tarefa/O.S.): escolher já adiciona, sem botão separado.
   mode "filter" (filtros de pesquisa): escolher define o filtro; tem opção "Todos" pra limpar. */
function empOptionsSorted(list){
  return (list||employees()).map(e=>({id:e._key!=null?e._key:e.id,name:empName(e)}))
    .filter(e=>e.name&&e.name!=="—").sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"));
}
function comboListHtml(comboId,options,mode,resetLabel){
  let html=mode==="filter"?`<button type="button" class="combo-opt reset" data-act="combo-pick" data-combo="${esc(comboId)}" data-value="" data-comboname="">${esc(resetLabel||"Todos")}</button>`:"";
  html+=options.map(o=>`<button type="button" class="combo-opt" data-act="combo-pick" data-combo="${esc(comboId)}" data-value="${esc(o.id)}" data-comboname="${esc(o.name)}">${esc(o.name)}</button>`).join("");
  return html||'<div class="combo-empty">Nenhum colaborador encontrado.</div>';
}
function empComboHtml(comboId,options,{mode="add",placeholder="Buscar…",resetLabel,currentLabel=""}={}){
  return `<div class="combo" data-combowrap="${esc(comboId)}">
    <div class="combo-input-wrap"><span class="emp-picker-icon">🔍</span>
      <input type="text" class="combo-input" id="${esc(comboId)}" data-comboinput="${esc(comboId)}" data-combomode="${esc(mode)}"
        placeholder="${esc(placeholder)}" autocomplete="off" value="${esc(currentLabel)}">
    </div>
    <div class="combo-list hidden" data-combolist="${esc(comboId)}">${comboListHtml(comboId,options,mode,resetLabel)}</div>
  </div>`;
}
function openCombo(comboId){
  document.querySelectorAll(".combo-list").forEach(l=>{if(l.dataset.combolist!==comboId)l.classList.add("hidden")});
  const list=document.querySelector(`.combo-list[data-combolist="${comboId}"]`);
  if(list)list.classList.remove("hidden");
}
function closeAllCombos(){document.querySelectorAll(".combo-list").forEach(l=>l.classList.add("hidden"))}
function filterCombo(comboId,query){
  const list=document.querySelector(`.combo-list[data-combolist="${comboId}"]`);
  if(!list)return;
  const q=norm(query);
  let anyVisible=false;
  list.querySelectorAll(".combo-opt").forEach(btn=>{
    if(btn.classList.contains("reset")){btn.style.display="";return} // "Todos" sempre visível, não conta pro "sem resultado"
    const match=!q||norm(btn.dataset.comboname||btn.textContent).includes(q);
    btn.style.display=match?"":"none";
    if(match)anyVisible=true;
  });
  let empty=list.querySelector(".combo-empty");
  if(!anyVisible&&!empty){
    empty=document.createElement("div");empty.className="combo-empty";empty.textContent="Nenhum colaborador encontrado.";
    list.appendChild(empty);
  }else if(anyVisible&&empty){empty.remove()}
}
/* trata a escolha feita num combobox — roteia por id porque cada um alimenta um lugar diferente
   (fila de responsáveis de tarefa/O.S., ou um filtro de pesquisa) */
function handleComboPick(comboId,mode,value,label){
  if(mode==="filter"){
    const routes={
      filterEmpAdmin:()=>{state.adminFilter.emp=value;render()},
      filterEmpPerf:()=>{state.perfFilter.emp=value;render()},
      filterEmpTeam:()=>{state.teamFilter.emp=value;render()}
    };
    if(routes[comboId])routes[comboId]();
    closeAllCombos();
    return;
  }
  if(!value)return;
  if(comboId==="fAddResp"&&formState){
    if(!formState.responsibles.map(String).includes(String(value))){formState.responsibles.push(value);refreshTaskResp()}
  }else if(comboId==="osAddResp"&&osFormState){
    if(!osFormState.responsibles.map(String).includes(String(value))){osFormState.responsibles.push(value);refreshOSResp()}
  }
}
function employeeById(id){if(id==null)return null;const s=String(id);return employees().find(e=>String(e.id)===s||String(e._key)===s)||null}
function sectorName(id){const s=sectors().find(x=>String(x.id)===String(id)||String(x._key)===String(id));return s?(pick(s,SCHEMA.nameFields)||s._key):(id||"—")}

function findShiftType(ref){
  if(ref==null)return null;const r=norm(ref);const arr=shiftTypes();
  return arr.find(s=>norm(s.id)===r||norm(s._key)===r)
      || arr.find(s=>{const n=pick(s,SCHEMA.nameFields);return n&&norm(n)===r})||null;
}
function isAbsenceName(label){if(!label)return false;const n=norm(label);return SCHEMA.absenceNames.some(a=>n===a||n.startsWith(a))}

/* célula bruta da escala para um empregado num dia (tenta as duas orientações) */
function scheduleCell(emp,dKey){
  const sch=ESCALA&&ESCALA.schedule;if(!sch||!emp)return undefined;
  const ids=[emp._key,emp.id].filter(v=>v!=null).map(String);
  for(const id of ids){
    if(sch[id]&&Object.prototype.hasOwnProperty.call(sch[id],dKey))return sch[id][dKey];
  }
  if(sch[dKey]){
    for(const id of ids)if(Object.prototype.hasOwnProperty.call(sch[dKey],id))return sch[dKey][id];
  }
  return undefined;
}

/* presença + faixa de horário de um empregado num dia */
function presenceFor(emp,dKey){
  const cell=scheduleCell(emp,dKey);
  if(cell==null||cell===""||cell===false)return {present:false,label:null,start:null,end:null};
  let start=null,end=null,label=null,absence=false;
  if(typeof cell==="object"){
    label=pick(cell,SCHEMA.nameFields);
    start=pick(cell,SCHEMA.startTimeFields);
    end  =pick(cell,SCHEMA.endTimeFields);
    if(SCHEMA.absenceFlagFields.some(f=>cell[f]===true))absence=true;
    const ref=pick(cell,SCHEMA.shiftRefFields);
    if((start==null||end==null)&&ref!=null){
      const st=findShiftType(ref);
      if(st){start=start||pick(st,SCHEMA.startTimeFields);end=end||pick(st,SCHEMA.endTimeFields);label=label||pick(st,SCHEMA.nameFields)}
      if(!st&&isAbsenceName(ref))absence=true;
      label=label||ref;
    }
  }else{
    const st=findShiftType(cell);
    if(st){start=pick(st,SCHEMA.startTimeFields);end=pick(st,SCHEMA.endTimeFields);label=pick(st,SCHEMA.nameFields)||String(cell)}
    else{label=String(cell)}
  }
  if(isAbsenceName(label))absence=true;
  const hasTimes=timeToMin(start)!=null&&timeToMin(end)!=null;
  return {present:!absence&&hasTimes,label,start,end,absence};
}

/* elegibilidade de um empregado para uma tarefa num dia */
function eligibility(emp,dKey,taskStart){
  const p=presenceFor(emp,dKey);
  if(!p.present)return {ok:false,reason:p.absence?"ausente":"sem turno",p};
  if(taskStart&&!withinShift(taskStart,p.start,p.end))return {ok:false,reason:"fora do turno",p};
  return {ok:true,reason:"ok",p};
}

/* fila: primeiro R presente/elegível */
function computeAssignee(task,dKey){
  for(const id of (task.responsibles||[])){
    const emp=employeeById(id);if(!emp)continue;
    if(eligibility(emp,dKey,task.startTime).ok)return id;
  }
  return null;
}

/* dias inteiros entre duas datas-chave */
function daysBetween(a,b){return Math.round((parseKey(b)-parseKey(a))/86400000)}

/* a tarefa ocorre nesse dia?
   Suporta: daily (a cada N dias), weekly (a cada N semanas, num dia da semana),
   monthly (a cada N meses, num dia fixo do mês). `interval` ausente = 1 (comportamento
   original, 100% compatível com tarefas criadas antes desta versão). */
function occursOn(task,dKey){
  if(task.active===false)return false;
  const base=task.createdDate||dKey;
  if(dKey<base)return false;
  const rec=task.recurrence||{type:"daily"};
  const interval=Math.max(1,Number(rec.interval)||1);
  if(rec.type==="weekly"){
    const days=Array.isArray(rec.weekdays)?rec.weekdays.map(Number):(rec.weekday!=null?[Number(rec.weekday)]:[1]);
    if(!days.includes(weekdayOf(dKey)))return false;
    if(interval===1)return true;
    return Math.floor(daysBetween(base,dKey)/7)%interval===0;
  }
  if(rec.type==="monthly"){
    const dayOfMonth=Number(rec.day)||parseKey(base).getDate();
    const d=parseKey(dKey);
    if(d.getDate()!==dayOfMonth)return false;
    if(interval===1)return true;
    const b=parseKey(base);
    const monthsDiff=(d.getFullYear()-b.getFullYear())*12+(d.getMonth()-b.getMonth());
    return monthsDiff>=0&&monthsDiff%interval===0;
  }
  // daily (padrão)
  if(interval===1)return true;
  return daysBetween(base,dKey)%interval===0;
}

/* ===================================================================
   6) MATERIALIZAÇÃO  (cria instâncias do dia / cobra atrasos)
   =================================================================== */
function materialize(){
  if(materializing||!ESCALA||!state.user)return;
  // Trava de segurança: se já vimos instâncias antes e agora a lista veio vazia (ou drasticamente
  // menor) enquanto ainda existem tarefas ativas, os dados locais estão degradados. Materializar
  // nesse estado recriaria como "pendente" tudo que já foi concluído. Melhor não fazer nada e
  // esperar o próximo snapshot íntegro.
  const nInst=Object.keys(INSTANCES).length, nTasks=Object.keys(TASKS).length;
  if(_maxInstancesSeen>0&&nTasks>0&&nInst<_maxInstancesSeen/2){
    console.warn(`[materialize] abortado: instâncias caíram de ${_maxInstancesSeen} para ${nInst} — dados possivelmente incompletos`);
    return;
  }
  if(nInst>_maxInstancesSeen)_maxInstancesSeen=nInst;
  materializing=true;
  const today=todayKey();
  const floor=addDays(today,-LOOKBACK_DAYS);
  const updates={};

  // Sob demanda / preocupação contínua: qualquer instância de dia PASSADO ainda pendente/em andamento
  // expira como não realizada ao virar o dia — não "atrasa" como as de A executar. Roda pra toda
  // instância existente, não só quando a tarefa tem uma ocorrência nova nascendo no dia seguinte
  // (senão uma tarefa semanal, por exemplo, ficaria "pendente" parada até a próxima ocorrência).
  for(const iid in INSTANCES){
    const ins=INSTANCES[iid];if(!ins||ins.date>=today)continue;
    if(ins.status!=="pendente"&&ins.status!=="em_andamento")continue;
    const task=TASKS[ins.taskId];if(!task)continue;
    const nature=task.nature||"executar";
    if(nature!=="demanda"&&nature!=="continua")continue;
    updates[`instances/${iid}/status`]="nao_realizada";
    updates[`instances/${iid}/autoExpired`]=true;
    const hist=Array.isArray(ins.history)?ins.history.slice():[];
    hist.push({type:"nao_realizada",by:"sistema",at:Date.now(),note:"Expirou automaticamente (virou o dia)"});
    updates[`instances/${iid}/history`]=hist;
    ins.status="nao_realizada"; // reflete localmente p/ não reprocessar no mesmo ciclo
    invalidateTerminalIndex();
  }

  // Marca d'água por tarefa: a data da instância mais recente que já existe.
  // Regra: nunca criar instância para uma data ANTERIOR a essa marca. Se a tarefa já materializou
  // até o dia X, qualquer dia anterior a X que esteja faltando foi deliberadamente não criado
  // (a recorrência da época não cobria aquele dia). Sem isso, editar a recorrência de uma tarefa
  // antiga — trocar o dia da semana, por exemplo — fazia nascerem dezenas de instâncias PENDENTES
  // retroativas, que apareciam para o colaborador como "tarefas antigas reabertas/atrasadas".
  // Dias FUTUROS em relação à marca continuam sendo criados normalmente, então o app segue
  // recuperando o atraso de quando ninguém abriu o sistema por alguns dias.
  const lastInstanceDate={};
  for(const iid in INSTANCES){
    const ins=INSTANCES[iid];if(!ins||!ins.taskId||!ins.date)continue;
    if(!lastInstanceDate[ins.taskId]||ins.date>lastInstanceDate[ins.taskId])lastInstanceDate[ins.taskId]=ins.date;
  }

  for(const tid in TASKS){
    const task=TASKS[tid];if(!task||task.active===false)continue;
    let d=maxKey(floor,task.createdDate||floor);
    if(task.recurrenceSince)d=maxKey(d,task.recurrenceSince); // regra nova vale a partir da mudança
    if(task.materializeFrom)d=maxKey(d,task.materializeFrom); // corte após limpeza de pendências indevidas
    const marca=lastInstanceDate[tid];
    if(marca)d=maxKey(d,marca); // nunca retroceder antes do que a tarefa já materializou
    // Teto de retroação: mesmo que a tarefa nunca tenha materializado (tarefa recém-criada com
    // createdDate antigo, ou instâncias apagadas), nunca criar mais que MAX_BACKFILL_DAYS dias
    // para trás. Sem esse teto, abrir o app depois de um tempo parado gerava dezenas de tarefas
    // "atrasadas" de dias que já passaram e que ninguém tem como executar.
    d=maxKey(d,addDays(today,-MAX_BACKFILL_DAYS));
    while(d<=today){
      if(occursOn(task,d)){
        const iid=`${tid}__${d}`;
        if(!INSTANCES[iid]){
          // Escreve por caminhos individuais (não o objeto inteiro) para nunca sobrescrever
          // uma instância existente que porventura não esteja no snapshot local.
          updates[`instances/${iid}/taskId`]=tid;
          updates[`instances/${iid}/date`]=d;
          updates[`instances/${iid}/occurrenceDate`]=d;
          updates[`instances/${iid}/assignedTo`]=computeAssignee(task,d);
          updates[`instances/${iid}/autoAssigned`]=true;
          updates[`instances/${iid}/status`]="pendente";
          updates[`instances/${iid}/createdAt`]=Date.now();
        }
      }
      d=addDays(d,1);
    }
  }
  // recalcula a fila SÓ das instâncias automáticas de hoje ainda pendentes
  for(const iid in INSTANCES){
    const ins=INSTANCES[iid];if(!ins)continue;
    if(ins.date===today&&ins.autoAssigned&&ins.status==="pendente"){
      const task=TASKS[ins.taskId];if(!task)continue;
      const should=computeAssignee(task,today);
      if((should||null)!==(ins.assignedTo||null))updates[`instances/${iid}/assignedTo`]=should;
    }
  }
  closeCompletedWeeks(updates);
  if(Object.keys(updates).length){
    dbRef(PATH.tarefas).update(updates).catch(e=>console.warn("materialize",e)).finally(()=>{materializing=false});
  }else{materializing=false}
}

/* ===================================================================
   6b) DESEMPENHO: índice de conclusão semanal por colaborador
   Regra: conta instâncias TERMINAIS (concluída / não realizada) com
   responsável definido (assignedTo preenchido). Pendentes/em andamento
   ainda não "fecharam" o dia; sem responsável não conta contra ninguém.
   ===================================================================== */
function empCpfKey(emp){return cpf11(onlyDigits(pick(emp,SCHEMA.cpfFields))||"")}

/* {completed, notDone, pct|null} de um colaborador num intervalo [from,to] inclusive */
/* Índice {cpfNorm: {dateKey: {completed, notDone}}} construído uma única vez por render,
   evitando varrer todas as instâncias a cada chamada de scoreForRange (eram dezenas de
   varreduras completas por tela — a causa da lentidão ao abrir Desempenho da equipe). */
let _terminalIndexCache=null;
let _terminalIndexInstancesRef=null;
function terminalIndex(){
  if(_terminalIndexCache&&_terminalIndexInstancesRef===INSTANCES)return _terminalIndexCache;
  const idx={};
  for(const iid in INSTANCES){
    const ins=INSTANCES[iid];if(!ins||!ins.assignedTo)continue;
    if(ins.status!=="concluida"&&ins.status!=="nao_realizada")continue;
    const emp=employeeById(ins.assignedTo);if(!emp)continue;
    const cpfNorm=empCpfKey(emp);if(!cpfNorm)continue;
    const byDate=idx[cpfNorm]=idx[cpfNorm]||{};
    const slot=byDate[ins.date]=byDate[ins.date]||{completed:0,notDone:0};
    if(ins.status==="concluida")slot.completed++;else slot.notDone++;
  }
  _terminalIndexCache=idx;
  _terminalIndexInstancesRef=INSTANCES;
  return idx;
}
function invalidateTerminalIndex(){_terminalIndexCache=null}
function scoreForRange(empCpfNorm,from,to){
  const effectiveFrom=SCORE_RESET_AT&&SCORE_RESET_AT>from?SCORE_RESET_AT:from;
  const byDate=terminalIndex()[empCpfNorm];
  let completed=0,notDone=0;
  if(byDate){
    for(const d in byDate){
      if(d<effectiveFrom||d>to)continue;
      completed+=byDate[d].completed;notDone+=byDate[d].notDone;
    }
  }
  const total=completed+notDone;
  return {completed,notDone,total,pct:total?Math.round(completed/total*100):null};
}
/* nota da semana corrente (parcial, seg→hoje), recalculada ao vivo — não é o registro fechado */
function currentWeekScore(empCpfNorm,today){
  today=today||todayKey();
  return scoreForRange(empCpfNorm,mondayOf(today),today);
}
/* nota FECHADA da semana imediatamente anterior (seg→dom completos), para comparação de tendência.
   Usa o registro salvo em WEEKLY_SCORES quando existe; senão calcula direto pelo intervalo completo
   (mesmo resultado, só não depende da materialização já ter rodado e salvo o registro). */
function previousClosedWeekScore(empCpfNorm,today){
  today=today||todayKey();
  const prevMonday=addDays(mondayOf(today),-7);
  const saved=WEEKLY_SCORES[empCpfNorm]&&WEEKLY_SCORES[empCpfNorm][prevMonday];
  if(saved)return {completed:saved.completed,notDone:saved.notDone,total:saved.completed+saved.notDone,pct:saved.pct};
  return scoreForRange(empCpfNorm,prevMonday,sundayOf(prevMonday));
}
/* fecha semanas inteiras (seg→dom) já totalmente passadas que ainda não têm registro salvo,
   para cada colaborador com CPF cadastrado. Roda dentro da materialização. */
function closeCompletedWeeks(updates){
  const today=todayKey();
  const curMonday=mondayOf(today);
  const allEmps=employees().filter(e=>empCpfKey(e));
  const weeksBack=Math.ceil(LOOKBACK_DAYS/7);
  for(const emp of allEmps){
    const cpfNorm=empCpfKey(emp);
    const saved=WEEKLY_SCORES[cpfNorm]||{};
    // sempre múltiplos exatos de 7 dias a partir da segunda-feira atual, garantindo cair em segundas-feiras reais
    for(let i=weeksBack;i>=1;i--){
      const d=addDays(curMonday,-7*i);
      if(!saved[d]){
        const sunday=sundayOf(d);
        const r=scoreForRange(cpfNorm,d,sunday);
        if(r.total>0){ // só registra semana em que houve ao menos 1 instância terminal
          updates[`weeklyScores/${cpfNorm}/${d}`]={pct:r.pct,completed:r.completed,notDone:r.notDone,closedAt:Date.now()};
        }
      }
    }
  }
}
function resetWeeklyScores(){
  if(!state.admin)return;
  if(!confirm("Isso vai apagar TODO o histórico de notas semanais salvas (de todos os colaboradores). As tarefas e o histórico de execução não são afetados. A partir de agora, a nota passa a contar apenas tarefas concluídas/não realizadas a partir de amanhã. Confirma?"))return;
  dbRef(PATH.tarefas).update({weeklyScores:null,scoreResetAt:addDays(todayKey(),1)}).then(()=>toast("Notas semanais zeradas"));
}
function scoreClass(pct){if(pct==null)return"none";if(pct>=80)return"good";if(pct>=50)return"mid";return"bad"}
/* últimas N semanas FECHADAS (histórico salvo) de um colaborador, mais antiga→mais recente */
function closedWeeksHistory(empCpfNorm,n){
  const saved=WEEKLY_SCORES[empCpfNorm]||{};
  return Object.keys(saved).sort().slice(-n).map(monday=>({monday,...saved[monday]}));
}
/* nota de UMA semana específica (por mondayKey) de um colaborador: usa o registro fechado quando
   existe; se for a semana atual (ainda não fechada), calcula ao vivo (parcial). */
function weekScorePct(empCpfNorm,mondayKey,today){
  today=today||todayKey();
  if(mondayKey===mondayOf(today))return currentWeekScore(empCpfNorm,today).pct;
  const saved=WEEKLY_SCORES[empCpfNorm]&&WEEKLY_SCORES[empCpfNorm][mondayKey];
  if(saved)return saved.pct;
  return scoreForRange(empCpfNorm,mondayKey,sundayOf(mondayKey)).pct;
}
/* as últimas N segundas-feiras (mondayKeys), da mais antiga para a mais recente, incluindo a atual */
function lastNMondays(today,n){
  const curMonday=mondayOf(today||todayKey());
  const out=[];
  for(let i=n-1;i>=0;i--)out.push(addDays(curMonday,-7*i));
  return out;
}
/* média simples ignorando nulls (semanas sem dados); null se nenhuma tiver dado */
function avgIgnoringNulls(arr){
  const valid=arr.filter(v=>v!=null);
  return valid.length?Math.round(valid.reduce((s,v)=>s+v,0)/valid.length):null;
}
/* série de pontos (1 por semana) para o gráfico: cpfNorms é a lista de colaboradores a agregar
   (1 pessoa = linha individual; várias = média do grupo por semana) */
function buildSeries(cpfNorms,weeks,today){
  return weeks.map(monday=>{
    const vals=cpfNorms.map(cpf=>weekScorePct(cpf,monday,today));
    return {monday,pct:avgIgnoringNulls(vals),partial:monday===mondayOf(today||todayKey())};
  });
}
/* card de nota semanal para a tela do próprio colaborador */
function scoreCardHtml(empCpfNorm){
  const today=todayKey();
  const cur=currentWeekScore(empCpfNorm,today);
  const prev=previousClosedWeekScore(empCpfNorm,today);
  const cls=scoreClass(cur.pct);
  const numHtml=cur.pct==null?`<div class="score-num none">—</div>`:`<div class="score-num ${cls}">${cur.pct}%</div>`;
  let trend="";
  if(cur.pct!=null&&prev.pct!=null){
    const diff=cur.pct-prev.pct;
    if(diff>=5)trend=`<div class="score-trend up">▲ ${diff} em relação à nota final da semana passada</div>`;
    else if(diff<=-5)trend=`<div class="score-trend down">▼ ${Math.abs(diff)} em relação à nota final da semana passada</div>`;
    else trend=`<div class="score-trend flat">≈ estável em relação à semana passada</div>`;
  }
  const hist=closedWeeksHistory(empCpfNorm,6);
  let histHtml="";
  if(hist.length){
    histHtml=`<div class="score-history">`+hist.map(w=>{
      const c=scoreClass(w.pct);
      const color=c==="good"?"var(--ok)":c==="mid"?"var(--demanda)":"#c0392b";
      return `<div class="wk"><div class="bar"><div class="fill" style="height:${w.pct}%;background:${color}"></div></div>
        <span class="pct">${w.pct}%</span></div>`;
    }).join("")+`</div><p class="note" style="margin-top:8px">Últimas semanas fechadas (a mais recente à direita)</p>`;
  }
  return `<div class="score-card">
    ${numHtml}
    <div class="score-label">Sua nota desta semana</div>
    <div class="score-period">${weekLabel(mondayOf(today))} · fecha domingo à noite · ${cur.total?`${cur.completed} de ${cur.total} tarefas`:"ainda sem tarefas fechadas esta semana"}</div>
    ${trend}
    ${histHtml}
  </div>`;
}

/* instâncias do empregado logado, agrupadas por natureza da tarefa */
function myInstances(){
  if(!state.emp)return {today:{executar:[],demanda:[],continua:[]},late:[],coresp:[],done:[]};
  const me=state.emp;
  const today=todayKey();const myIds=[me._key,me.id].filter(v=>v!=null).map(String);
  const mine=id=>myIds.includes(String(id));
  const todayG={executar:[],demanda:[],continua:[]},lateArr=[],coresp=[],doneArr=[];
  for(const iid in INSTANCES){
    const ins=INSTANCES[iid];if(!ins)continue;const task=TASKS[ins.taskId];if(!task||task.active===false)continue;
    if(mine(ins.assignedTo)){
      if(ins.status==="adiada"||ins.status==="nao_realizada")continue; // terminais, saem das listas ativas
      if(ins.status==="concluida"){if(ins.date===today)doneArr.push({iid,ins,task});continue}
      const nature=task.nature||"executar";
      if(ins.date===today)(todayG[nature]||todayG.executar).push({iid,ins,task});
      else if(ins.date<today)lateArr.push({iid,ins,task}); // atraso só acumula de fato p/ "executar" (demanda/continua já expiram na materialização)
    }
  }
  // co-responsável: tarefas de hoje onde estou na lista mas não sou o responsável ativo
  for(const iid in INSTANCES){
    const ins=INSTANCES[iid];if(!ins||ins.date!==today)continue;const task=TASKS[ins.taskId];if(!task||task.active===false)continue;
    const idx=(task.responsibles||[]).findIndex(mine);
    if(idx>=0&&!mine(ins.assignedTo)&&ins.status!=="adiada")coresp.push({iid,ins,task,rlevel:idx+1});
  }
  const ord=(a,b)=>(timeToMin(a.task.startTime)??1e9)-(timeToMin(b.task.startTime)??1e9);
  todayG.executar.sort(ord);todayG.demanda.sort(ord);todayG.continua.sort(ord);
  lateArr.sort((a,b)=>a.ins.date<b.ins.date?-1:1);
  doneArr.sort((a,b)=>(b.ins.completedAt||0)-(a.ins.completedAt||0));
  return {today:todayG,late:lateArr,coresp,done:doneArr};
}

/* ===================================================================
   7) AÇÕES sobre instâncias
   =================================================================== */
function canAct(ins){
  if(state.admin)return true;
  const me=state.emp;if(!me)return false;
  return [me._key,me.id].map(String).includes(String(ins.assignedTo));
}
function pushHistory(iid,entry){
  const ins=INSTANCES[iid];const hist=Array.isArray(ins.history)?ins.history.slice():[];
  hist.push({...entry,by:state.user.username,at:Date.now()});
  return hist;
}
/* a tarefa tem checklist e está toda marcada nesta instância? */
function checklistComplete(task,ins){
  const items=task&&task.checklist;
  if(!items||!items.length)return true;
  const st=(ins&&ins.checklistState)||{};
  return items.every(it=>st[it.id]===true);
}
function startTask(iid){
  const ins=INSTANCES[iid];if(!ins||!canAct(ins))return;
  dbRef(`${PATH.tarefas}/instances/${iid}`).update({status:"em_andamento",startedAt:Date.now(),history:pushHistory(iid,{type:"iniciada"})});
  toast("Tarefa iniciada");
}
/* Se a instância alterada pertence a uma semana já FECHADA (registro salvo em weeklyScores),
   recalcula esse registro na hora — sem isso, conclusões/reaberturas tardias de uma semana
   antiga não atualizariam a nota que já tinha sido arquivada. */
function patchClosedWeekIfNeeded(insDate,empId,updates){
  const emp=employeeById(empId);if(!emp)return;
  const cpfNorm=empCpfKey(emp);if(!cpfNorm)return;
  const monday=mondayOf(insDate);
  if(monday===mondayOf(todayKey()))return; // semana atual não é "fechada", recalcula sozinha ao vivo
  const saved=WEEKLY_SCORES[cpfNorm]&&WEEKLY_SCORES[cpfNorm][monday];
  if(!saved)return; // nunca foi fechada (ainda fora do histórico) — nada a corrigir
  const r=scoreForRange(cpfNorm,monday,sundayOf(monday));
  updates[`weeklyScores/${cpfNorm}/${monday}`]=r.total>0
    ?{pct:r.pct,completed:r.completed,notDone:r.notDone,closedAt:Date.now()}
    :null; // se não restou nenhuma instância terminal (raro), remove o registro em vez de salvar lixo
}
function completeTask(iid,note){
  const ins=INSTANCES[iid];if(!ins||!canAct(ins))return;
  const task=TASKS[ins.taskId];
  if(!checklistComplete(task,ins)){toast("Marque todos os itens do checklist antes de concluir.");return}
  const updates={};
  updates[`instances/${iid}/status`]="concluida";
  updates[`instances/${iid}/completedAt`]=Date.now();
  updates[`instances/${iid}/history`]=pushHistory(iid,{type:"concluida",note:note||null});
  if(note&&note.trim())updates[`instances/${iid}/completionNote`]=note.trim();
  ins.status="concluida"; // reflete localmente ANTES de recalcular semana fechada, senão o cálculo usaria o status antigo
  invalidateTerminalIndex();
  patchClosedWeekIfNeeded(ins.date,ins.assignedTo,updates);
  dbRef(PATH.tarefas).update(updates);
  toast("Tarefa concluída ✓");
}
function markNotDone(iid,note){
  const ins=INSTANCES[iid];if(!ins||!canAct(ins))return;
  const updates={};
  updates[`instances/${iid}/status`]="nao_realizada";
  updates[`instances/${iid}/completedAt`]=null;
  updates[`instances/${iid}/history`]=pushHistory(iid,{type:"nao_realizada",note:note||null});
  if(note&&note.trim())updates[`instances/${iid}/completionNote`]=note.trim();
  ins.status="nao_realizada";
  invalidateTerminalIndex();
  patchClosedWeekIfNeeded(ins.date,ins.assignedTo,updates);
  dbRef(PATH.tarefas).update(updates);
  toast("Marcada como não realizada");
}
function reopenTask(iid){
  const ins=INSTANCES[iid];if(!ins||!canAct(ins))return;
  if(!confirm("Reabrir esta tarefa? Ela volta para pendente."))return;
  const updates={};
  updates[`instances/${iid}/status`]="pendente";
  updates[`instances/${iid}/completedAt`]=null;
  updates[`instances/${iid}/completionNote`]=null;
  updates[`instances/${iid}/autoExpired`]=null;
  updates[`instances/${iid}/history`]=pushHistory(iid,{type:"reaberta"});
  ins.status="pendente";
  invalidateTerminalIndex();
  patchClosedWeekIfNeeded(ins.date,ins.assignedTo,updates);
  dbRef(PATH.tarefas).update(updates);
  toast("Tarefa reaberta");
}

function transferToR(iid,toEmpId){
  const ins=INSTANCES[iid];if(!ins||!(canAct(ins)||canManageTeam()))return;
  dbRef(`${PATH.tarefas}/instances/${iid}`).update({assignedTo:String(toEmpId),autoAssigned:false,
    history:pushHistory(iid,{type:"transferida",to:String(toEmpId)})});
  closeModal();toast("Transferida para "+empName(employeeById(toEmpId)));
}
function postpone(iid,toDate){
  const ins=INSTANCES[iid];if(!ins||!canAct(ins))return;
  const task=TASKS[ins.taskId];const newIid=`${ins.taskId}__${toDate}`;
  const updates={};
  updates[`instances/${iid}/status`]="adiada";
  updates[`instances/${iid}/history`]=pushHistory(iid,{type:"adiada",to:toDate});
  if(!INSTANCES[newIid]){
    updates[`instances/${newIid}`]={taskId:ins.taskId,date:toDate,occurrenceDate:ins.occurrenceDate,
      assignedTo:computeAssignee(task,toDate),autoAssigned:true,status:"pendente",createdAt:Date.now(),
      history:[{type:"recebida-adiamento",from:ins.date,by:state.user.username,at:Date.now()}]};
  }
  dbRef(PATH.tarefas).update(updates);
  closeModal();toast("Adiada para "+fmtDate(toDate));
}

/* ===================================================================
   7b) DISCUSSÕES (chat único por tarefa/O.S., substitui o antigo sistema de tickets por autor)
   =================================================================== */
function threadKey(type,id){return type+"_"+id}
function getThread(type,id){return DISCUSSIONS[threadKey(type,id)]||null}
function threadParentInfo(type,id){
  if(type==="task"){
    const t=TASKS[id];
    return {title:t?t.title:"(tarefa removida)",sectorId:t?t.sectorId:null,exists:!!t,icon:"📋"};
  }
  const o=SERVICE_ORDERS[id];
  return {title:o?o.title:"(O.S. removida)",sectorId:o?o.sectorId:null,exists:!!o,icon:"🔧"};
}
/* quem pode ler/escrever numa discussão: gestor sempre; numa tarefa, quem está na fila R1/R2/R3 dela
   ou já participou antes (não perde acesso se a fila mudar no meio da conversa); numa O.S., a mesma
   regra do chat que já existia (Lideranças + fila + quem abriu) */
function canChatThread(type,id){
  if(state.admin)return true;
  if(!state.emp)return false;
  const myIds=[state.emp._key,state.emp.id].filter(v=>v!=null).map(String);
  if(type==="os"){
    const os=SERVICE_ORDERS[id];if(!os)return false;
    if(isLideranca(state.emp))return true;
    if((os.responsibles||[]).some(x=>myIds.includes(String(x))))return true;
    if(os.openedBy===state.user.username)return true;
    return false;
  }
  const task=TASKS[id];
  if(task&&(task.responsibles||[]).some(x=>myIds.includes(String(x))))return true;
  const th=getThread("task",id);
  if(th&&(th.messages||[]).some(m=>String(m.by)===String(state.user.username)))return true;
  return false;
}
/* inativa automaticamente sem mensagem nova há DISCUSSION_INACTIVE_DAYS, ou manualmente pelo gestor;
   qualquer mensagem nova (de quem for) tira do modo inativo */
function threadIsInactive(thread){
  if(!thread)return false;
  const msgs=thread.messages||[];
  if(!msgs.length)return false;
  if(thread.inactive===true)return true;
  return (Date.now()-msgs[msgs.length-1].at)>DISCUSSION_INACTIVE_MS;
}
function threadHasUnread(type,id){
  const th=getThread(type,id);if(!th)return false;
  const msgs=th.messages||[];if(!msgs.length)return false;
  const last=msgs[msgs.length-1];
  if(String(last.by)===String(state.user.username))return false;
  const readAt=(th.readBy&&th.readBy[state.user.username])||0;
  return last.at>readAt;
}
function markThreadRead(type,id){
  const key=threadKey(type,id);const th=DISCUSSIONS[key];if(!th)return;
  const msgs=th.messages||[];if(!msgs.length)return;
  const lastAt=msgs[msgs.length-1].at;
  const already=(th.readBy&&th.readBy[state.user.username])||0;
  if(already>=lastAt)return;
  dbRef(`${PATH.tarefas}/discussions/${key}/readBy/${state.user.username}`).set(lastAt);
}
/* todas as threads que o usuário logado pode ver — usado pro filtro de "Minhas discussões" e pro sininho */
function myVisibleThreadKeys(){
  if(state.admin)return Object.keys(DISCUSSIONS);
  if(!state.emp)return [];
  const keys=[];
  for(const tid in TASKS){
    const t=TASKS[tid];if(!t||t.active===false)continue;
    if(canChatThread("task",tid))keys.push(threadKey("task",tid));
  }
  for(const osid in SERVICE_ORDERS){
    if(canChatThread("os",osid))keys.push(threadKey("os",osid));
  }
  return [...new Set(keys)];
}
function anyUnreadDiscussions(){
  for(const key of myVisibleThreadKeys()){
    const th=DISCUSSIONS[key];if(!th)continue;
    const msgs=th.messages||[];if(!msgs.length)continue;
    const last=msgs[msgs.length-1];
    if(String(last.by)===String(state.user.username))continue;
    const readAt=(th.readBy&&th.readBy[state.user.username])||0;
    if(last.at>readAt)return true;
  }
  return false;
}
function addDiscussionMessage(type,id,text){
  if(!text||!text.trim())return;
  if(!canChatThread(type,id))return;
  const key=threadKey(type,id);
  const th=DISCUSSIONS[key];
  const messages=th&&Array.isArray(th.messages)?th.messages.slice():[];
  messages.push({by:state.user.username,text:text.trim(),at:Date.now()});
  const updates={messages,inactive:false};
  if(!th){updates.parentType=type;updates.parentId=id;updates.status="aberto";updates.createdAt=Date.now()}
  dbRef(`${PATH.tarefas}/discussions/${key}`).update(updates).then(()=>{
    const inp=$("#discReply");if(inp)inp.value="";
    markThreadRead(type,id);
    refreshOpenDiscussion(type,id);
  });
}
function markThreadInactive(type,id){
  if(!state.admin)return;
  dbRef(`${PATH.tarefas}/discussions/${threadKey(type,id)}`).update({inactive:true}).then(()=>refreshOpenDiscussion(type,id));
}
function markThreadActiveManual(type,id){
  if(!state.admin)return;
  dbRef(`${PATH.tarefas}/discussions/${threadKey(type,id)}`).update({inactive:false}).then(()=>refreshOpenDiscussion(type,id));
}
/* fecha a discussão quando o "dono" dela termina de vez — só se aplica à O.S. (concluída/cancelada é
   permanente); tarefa recorrente NÃO fecha ao concluir o dia, porque a mesma conversa vale pra vida toda
   da tarefa, não só pra uma ocorrência */
function closeDiscussionOnParentEnd(type,id){
  const key=threadKey(type,id);const th=DISCUSSIONS[key];if(!th)return; // nunca houve conversa, nada a fechar
  dbRef(`${PATH.tarefas}/discussions/${key}`).update({status:"fechado",closedAt:Date.now(),closedBy:state.user.username});
}
function reopenDiscussionThread(type,id){
  if(!state.admin)return;
  dbRef(`${PATH.tarefas}/discussions/${threadKey(type,id)}`).update({status:"aberto",closedAt:null,closedBy:null}).then(()=>refreshOpenDiscussion(type,id));
}
let openDiscussion=null; // {type,id} da discussão aberta no momento, pra saber se precisa re-renderizar
function refreshOpenDiscussion(type,id){
  if(openDiscussion&&openDiscussion.type===type&&String(openDiscussion.id)===String(id))openDiscussionThread(type,id);
}
function employeeByCpf(cpf){
  const digits=onlyDigits(cpf);if(!digits)return null;
  return employees().find(e=>{const c=onlyDigits(pick(e,SCHEMA.cpfFields));return c&&cpf11(c)===cpf11(digits)})||null;
}
/* migração one-shot (idempotente, pode rodar de novo sem duplicar): junta os tickets antigos (1 por autor)
   numa thread só por tarefa, e traz o chat de O.S. que já existia embutido pra cá também */
function migrateTicketsToDiscussions(){
  if(!state.admin)return;
  if(!confirm("Migrar conversas antigas para o novo formato de Discussões? Pode rodar de novo sem duplicar."))return;
  const updates={};let migratedTasks=0,migratedOS=0;
  const byTask={};
  for(const tid in TICKETS){
    const t=TICKETS[tid];if(!t||!t.taskId)continue;
    (byTask[t.taskId]=byTask[t.taskId]||[]).push(...(t.messages||[]));
  }
  for(const taskId in byTask){
    const key="task_"+taskId;if(DISCUSSIONS[key])continue;
    const msgs=byTask[taskId].slice().sort((a,b)=>a.at-b.at);
    if(!msgs.length)continue;
    updates[`discussions/${key}`]={parentType:"task",parentId:taskId,status:"aberto",createdAt:msgs[0].at,messages:msgs};
    migratedTasks++;
  }
  for(const osid in SERVICE_ORDERS){
    const os=SERVICE_ORDERS[osid];if(!os||!os.messages||!os.messages.length)continue;
    const key="os_"+osid;if(DISCUSSIONS[key])continue;
    const closed=os.status==="concluida"||os.status==="cancelada";
    updates[`discussions/${key}`]={parentType:"os",parentId:osid,status:closed?"fechado":"aberto",createdAt:os.messages[0].at,messages:os.messages};
    migratedOS++;
  }
  if(!migratedTasks&&!migratedOS){toast("Nada para migrar — já está tudo no novo formato.");return}
  dbRef(PATH.tarefas).update(updates).then(()=>toast(`Migradas ${migratedTasks} conversa(s) de tarefa e ${migratedOS} de O.S.`));
}

/* ---- Modal: conversa única de uma tarefa ou O.S. ---- */
function openDiscussionThread(type,id){
  if(!canChatThread(type,id)){toast("Você não tem acesso a esta conversa.");return}
  openDiscussion={type,id};
  markThreadRead(type,id);
  const info=threadParentInfo(type,id);
  const th=getThread(type,id);
  const msgs=th?(th.messages||[]):[];
  const bubbles=msgs.map(m=>{
    const isMe=String(m.by)===String(state.user.username);
    const who=m.by==="gestor"||/gestor/i.test(m.by)?"Gestor":(empName(employeeByCpf(m.by))||"Colaborador");
    return `<div class="bubble ${isMe?"me":"other"}"><span class="bwho">${esc(isMe?"Você":who)}</span>${esc(m.text)}
      <span class="bwhen">${new Date(m.at).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span></div>`;
  }).join("");
  const isClosed=th&&th.status==="fechado";
  const inactive=threadIsInactive(th);
  const canReply=canChatThread(type,id)&&!isClosed;
  const statusCls=isClosed?"ticket-fechado":(inactive?"ticket-inativo":"ticket-aberto");
  const statusLbl=isClosed?"Fechada":(inactive?"Inativa":"Ativa");
  let adminExtra="";
  if(state.admin){
    if(isClosed){
      adminExtra+=`<button class="btn ghost" data-act="reopen-discussion" data-type="${type}" data-id="${esc(id)}">Reabrir</button>`;
    }else{
      adminExtra+=(th&&th.inactive===true)
        ?`<button class="btn ghost" data-act="reactivate-discussion" data-type="${type}" data-id="${esc(id)}">Reativar</button>`
        :`<button class="btn ghost" data-act="deactivate-discussion" data-type="${type}" data-id="${esc(id)}">Marcar inativa</button>`;
    }
    if(type==="task")adminExtra+=`<button class="btn ghost" data-act="edit-task-from-discussion" data-id="${esc(id)}">Editar tarefa</button>`;
  }
  let footer;
  if(canReply){
    footer=`<div class="field"><textarea id="discReply" placeholder="Escrever uma mensagem…" style="min-height:54px"></textarea></div>
      <div class="sheet-actions">
        <button class="btn ghost" data-act="close">Fechar</button>
        ${adminExtra}
        <button class="btn primary" data-act="send-discussion-reply" data-type="${type}" data-id="${esc(id)}">Enviar</button>
      </div>`;
  }else{
    const closedNote=isClosed?("Esta conversa foi encerrada"+(th&&th.closedBy?" por "+esc(th.closedBy==="gestor"||/gestor/i.test(th.closedBy)?"Gestor":th.closedBy):"")+"."):"Você não pode responder nesta conversa.";
    footer=`<p class="note" style="text-align:center">${closedNote}</p>
      <div class="sheet-actions">
        ${adminExtra}
        <button class="btn primary" data-act="close" style="${adminExtra?"":"flex:none;width:100%"}">Fechar</button>
      </div>`;
  }
  openSheet(`${info.icon} ${info.title}`,`
    <div class="meta" style="margin-bottom:10px"><span class="status ${statusCls}">${statusLbl}</span>${info.sectorId?`<span class="chip sector">${esc(sectorName(info.sectorId))}</span>`:""}</div>
    <div class="chat">${bubbles||'<p class="note">Nenhuma mensagem ainda. Escreva a primeira abaixo.</p>'}</div>
    ${footer}
  `);
}

/* ---- Views ---- */
function discussionRow(key,th){
  const [type,...rest]=key.split("_");const id=rest.join("_");
  const info=threadParentInfo(type,id);
  const last=(th.messages||[]).slice(-1)[0];
  const unread=state.emp||state.admin?threadHasUnread(type,id):false;
  const inact=threadIsInactive(th);
  const statusCls=th.status==="fechado"?"ticket-fechado":(inact?"ticket-inativo":"ticket-aberto");
  const statusLbl=th.status==="fechado"?"Fechada":(inact?"Inativa":"Ativa");
  return `<button type="button" class="ticket-row" data-act="open-discussion" data-type="${type}" data-id="${esc(id)}">
    <div class="tmain">
      <span class="ttitle">${info.icon} ${esc(info.title)}${unread?' <span class="badge-dot"></span>':""}</span>
      <span class="tpreview">${esc(last?last.text:"")}</span>
      <span class="tmeta">${(th.messages||[]).length} mensagem(ns) · ${last?fmtDate(dateKey(new Date(last.at))):""}</span>
    </div>
    <span class="status ${statusCls}">${statusLbl}</span>
  </button>`;
}
function discFilterBar(){
  const F=state.discFilter||"active";
  return `<div class="filters" style="margin-bottom:10px">
    <select data-filter-disc="1">
      <option value="active" ${F==="active"?"selected":""}>Ativas</option>

      <option value="all" ${F==="all"?"selected":""}>Todas</option>
    </select>
  </div>`;
}
function viewMyDiscussions(){
  if(!state.emp)return `<div class="empty"><b>Disponível só para colaboradores.</b></div>`;
  const keys=myVisibleThreadKeys();
  const items=keys.map(k=>DISCUSSIONS[k]?{key:k,th:DISCUSSIONS[k]}:null).filter(Boolean);
  const F=state.discFilter||"active";
  const filtered=items.filter(({th})=>{
    const inact=threadIsInactive(th);
    if(F==="active")return !inact&&th.status!=="fechado";
    if(F==="inactive")return inact||th.status==="fechado";
    return true;
  }).sort((a,b)=>{
    const la=(a.th.messages||[]).slice(-1)[0],lb=(b.th.messages||[]).slice(-1)[0];

function viewDiscussionsAdmin(){
  const items=Object.entries(DISCUSSIONS).map(([key,th])=>({key,th}));
  const F=state.discFilter||"active";
  const activeCount=items.filter(({th})=>!threadIsInactive(th)&&th.status!=="fechado").length;
  let h=`<div class="diag"><div class="kv"><span>Ativas:</span> <b>${activeCount}</b><span>Total:</span> <b>${items.length}</b></div></div>`;

    if(F==="active")return !inact&&th.status!=="fechado";
    if(F==="inactive")return inact||th.status==="fechado";
    return true;
  }).sort((a,b)=>{
    const la=(a.th.messages||[]).slice(-1)[0],lb=(b.th.messages||[]).slice(-1)[0];
    return (lb?lb.at:0)-(la?la.at:0);

  if(!filtered.length){h+=`<div class="empty"><b>Nenhuma discussão ${F==="active"?"ativa":"inativa"} no momento.</b></div>`;return h}
