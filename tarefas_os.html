/* ===================================================================
   7c) ORDENS DE SERVIÇO (O.S.) — pontuais, sem recorrência, com prioridade e prazo opcional
   =================================================================== */
/* colaborador do setor "Lideranças" (cadastro na escala) — libera abrir/ver O.S., igual ao gestor.
   Aceita tanto o nome do setor escrito direto no campo quanto um ID que aponte pra um setor
   chamado "Lideranças" na lista de setores (alguns cadastros guardam o ID, não o texto). */
function isLideranca(emp){
  if(!emp)return false;
  const v=pick(emp,SCHEMA.employeeSectorFields);
  if(v==null)return false;
  if(norm(v)===norm(LIDERANCA_SETOR))return true;
  const resolved=sectorName(v);
  return !!resolved && norm(resolved)===norm(LIDERANCA_SETOR);
}
function canOpenOS(){return state.admin||isLideranca(state.emp)}
/* Lideranças também pode transferir tarefas de qualquer colaborador (visão "Equipe"), não só as próprias */
function canManageTeam(){return state.admin||isLideranca(state.emp)}
/* responsável elegível de hoje (primeiro da fila presente na escala), igual à lógica das tarefas mas sem horário fixo */
function osComputeAssignee(os){
  const today=todayKey();
  for(const id of (os.responsibles||[])){
    const emp=employeeById(id);if(!emp)continue;
    if(eligibility(emp,today,null).ok)return id;
  }
  return null;
}
/* responsável ATUAL de fato: se já foi transferida manualmente (autoAssigned:false) ou está em andamento, respeita
   quem está travado; só recalcula pela fila do dia se ainda está aberta e nunca foi transferida */
function osCurrentAssignee(os){
  if(os.status==="em_andamento")return os.assignedTo;
  if(os.status==="aberta"){
    if(os.autoAssigned===false&&os.assignedTo)return os.assignedTo;
    return osComputeAssignee(os);
  }
  return null;
}
/* pode agir (iniciar/concluir) nesta O.S.? enquanto "aberta", só quem é o elegível de hoje; depois de iniciada, trava com quem iniciou */
function canActOS(os){
  if(!os)return false;
  if(state.admin)return true;
  const me=state.emp;if(!me)return false;
  const myIds=[me._key,me.id].filter(v=>v!=null).map(String);
  if(os.status==="em_andamento")return myIds.includes(String(os.assignedTo));
  if(os.status==="aberta")return myIds.includes(String(osCurrentAssignee(os)));
  return false;
}
function osChecklistComplete(os){
  const items=os&&os.checklist;
  if(!items||!items.length)return true;
  const st=(os&&os.checklistState)||{};
  return items.every(it=>st[it.id]===true);
}
function pushOSHistory(os,entry){

/* O.S. em que o colaborador logado está na fila e é, hoje, quem deve agir (elegível de hoje ou já travado nela) */
function myOSQueue(){
  if(!state.emp)return [];
  const myIds=[state.emp._key,state.emp.id].filter(v=>v!=null).map(String);
  const out=[];
  for(const osid in SERVICE_ORDERS){
    const os=SERVICE_ORDERS[osid];if(!os)continue;
    if(os.status!=="aberta"&&os.status!=="em_andamento")continue;
    if(!(os.responsibles||[]).some(id=>myIds.includes(String(id))))continue;
    if(os.status==="em_andamento"&&!myIds.includes(String(os.assignedTo)))continue;
    if(os.status==="aberta"&&!myIds.includes(String(osCurrentAssignee(os))))continue;
    out.push({osid,os});
  }
  const prioRank={urgente:0,normal:1,programada:2};
  out.sort((a,b)=>{
    const pa=prioRank[a.os.priority]??1,pb=prioRank[b.os.priority]??1;
    if(pa!==pb)return pa-pb;
    return (a.os.createdAt||0)-(b.os.createdAt||0);
  });
  return out;
}
function startOS(osid){
  const os=SERVICE_ORDERS[osid];if(!os||os.status!=="aberta"||!canActOS(os))return;
  const assignee=state.admin?osCurrentAssignee(os):(state.emp._key!=null?state.emp._key:state.emp.id);
  if(assignee==null){toast("Sem responsável elegível hoje.");return}
  dbRef(`${PATH.tarefas}/serviceOrders/${osid}`).update({
    status:"em_andamento",assignedTo:String(assignee),startedAt:Date.now(),startedBy:state.user.username,
    history:pushOSHistory(os,{type:"iniciada"})
  }).then(()=>{toast("O.S. iniciada");refreshOpenOSModal(osid);});
}

function saveTask(data,id){
  const tid=id||genId("t");
  const anterior=id?TASKS[id]:null;
  // Se a recorrência mudou (ou a tarefa foi reativada), marca a data da mudança. A materialização
  // não cria ocorrências anteriores a essa data: a regra nova vale daqui pra frente, não retroage.
  // Sem isso, trocar "toda segunda" por "seg a sex" fazia nascerem pendências nos dias passados.
  const recMudou=anterior&&JSON.stringify(anterior.recurrence||{})!==JSON.stringify(data.recurrence||{});
  const reativou=anterior&&anterior.active===false;
  const recurrenceSince=(!anterior||recMudou||reativou)?todayKey():(anterior.recurrenceSince||anterior.createdDate||todayKey());
  const payload={
    title:data.title.trim(),description:(data.description||"").trim(),sectorId:data.sectorId||"",
    nature:data.nature||"executar",
    startTime:data.startTime||null,responsibles:data.responsibles,
    recurrence:data.recurrence,checklist:data.checklist||[],active:true,
    createdDate:data.createdDate||todayKey(),createdBy:data.createdBy||state.user.username,
    recurrenceSince,updatedAt:Date.now()
  };
  return dbRef(`${PATH.tarefas}/tasks/${tid}`).set(payload).then(()=>{closeModal();toast(id?"Tarefa atualizada":"Tarefa criada")});
}

function doLogin(){
  const errBox=$("#loginError");errBox.classList.add("hidden");

    if(GESTOR_PIN&&$("#lgPass").value!==GESTOR_PIN){show("Senha do gestor incorreta.");return}

/* prévia read-only de dias futuros: não há instância materializada ainda (materialize() só olha
   até hoje), então recalcula ao vivo com occursOn()/computeAssignee() — as mesmas funções puras
   que a materialização usa, só que sem gravar nada no banco. Pode mudar até o dia chegar, se a
   escala mudar nesse meio tempo. */
function myFuturePreview(dKey){
  if(!state.emp)return {groups:{executar:[],demanda:[],continua:[]},coresp:[]};
  const myIds=[state.emp._key,state.emp.id].filter(v=>v!=null).map(String);
  const mine=id=>myIds.includes(String(id));
  const groups={executar:[],demanda:[],continua:[]},coresp=[];
  for(const tid in TASKS){
    const task=TASKS[tid];if(!task||task.active===false)continue;
    if(!occursOn(task,dKey))continue;
    const idx=(task.responsibles||[]).findIndex(mine);
    if(idx<0)continue;
    const assignee=computeAssignee(task,dKey);
    const nature=task.nature||"executar";
    if(mine(assignee))(groups[nature]||groups.executar).push({task,dKey,assignee});
    else coresp.push({task,dKey,assignee,rlevel:idx+1});
  }
  const ord=(a,b)=>(timeToMin(a.task.startTime)??1e9)-(timeToMin(b.task.startTime)??1e9);
  groups.executar.sort(ord);groups.demanda.sort(ord);groups.continua.sort(ord);
  return {groups,coresp};
}

    const {groups,coresp}=myFuturePreview(dKey);
    h+=`<p class="note" style="margin:0 2px 12px">Prévia de ${fmtDate(dKey)} — calculada pela escala de hoje, pode mudar até lá. Ações (iniciar/concluir) só ficam disponíveis no dia.</p>`;
    if(coresp.length){
      h+=`<button type="button" class="btn ghost full" data-act="show-coresp-future" data-date="${dKey}" style="margin-bottom:14px">👀 Você é co-responsável em ${coresp.length} tarefa(s) nesse dia</button>`;
    }
    if(groups.continua.length){
      h+=dayBlockHead("continua","👁","Preocupação contínua",null,groups.continua.length);
      h+=groups.continua.map(taskCardFuture).join("");
    }
    if(groups.demanda.length){
      h+=dayBlockHead("demanda","📡","Sob demanda",null,groups.demanda.length);
      h+=groups.demanda.map(taskCardFuture).join("");
    }
    h+=dayBlockHead("executar","✅","A executar",null,groups.executar.length);
    h+=groups.executar.length?groups.executar.map(taskCardFuture).join(""):
      `<div class="empty"><b>Nada previsto pra executar nesse dia.</b></div>`;
    return h;
  }

  const {today,late,coresp,done}=myInstances();
  if(coresp.length){
    h+=`<button type="button" class="btn ghost full" data-act="show-coresp" style="margin-bottom:14px">👀 Você é co-responsável em ${coresp.length} tarefa(s) hoje</button>`;
  }
  const myOS=myOSQueue();
  if(myOS.length){
    h+=dayBlockHead("os","🔧","Ordens de serviço",null,myOS.length);
    h+=myOS.map(({osid,os})=>osCardMine(os,osid)).join("");
  }

  // ordem pensada para contar o dia: primeiro o "estado de espírito", depois o que pode surgir, por fim o que executar
  if(today.continua.length){
    h+=dayBlockHead("continua","👁","Mantenha isso em mente hoje","Preocupações contínuas que você precisa ter hoje.",today.continua.length);
    h+=today.continua.map(t=>taskCardMine(t)).join("");
  }
  if(today.demanda.length){
    h+=dayBlockHead("demanda","📡","Fique atento — pode surgir hoje","Você está responsável por responder caso essas situações aconteçam.",today.demanda.length);
    h+=today.demanda.map(t=>taskCardMine(t)).join("");
  }
  h+=dayBlockHead("executar","✅","Tarefas que você precisa executar hoje",null,today.executar.length);
  h+=today.executar.length?today.executar.map(t=>taskCardMine(t)).join(""):
    `<div class="empty"><b>Sem tarefas para executar hoje.</b>Aproveite — ou confira se há algo atrasado abaixo.</div>`;

  if(late.length){
    h+=dayBlockHead("late","⏰","Atrasadas",null,late.length);
    h+=late.map(t=>taskCardMine(t)).join("");
  }
  if(done.length){
    h+=dayBlockHead("done","✓","Concluídas hoje",null,done.length);
    h+=done.map(t=>taskCardMine(t)).join("");
  }
  return h;
}

/* ---- Minhas responsabilidades: painel analítico (sem status do dia) ---- */
function myActiveTasksWithLevel(){
  const myIds=[state.emp._key,state.emp.id].filter(v=>v!=null).map(String);
  const out=[];
  for(const tid in TASKS){
    const t=TASKS[tid];if(!t||t.active===false)continue;
    const idx=(t.responsibles||[]).findIndex(id=>myIds.includes(String(id)));
    if(idx<0)continue;
    out.push({...t,_tid:tid,_level:idx+1});
  }
  return out;
}
/* setores das tarefas ativas em que um colaborador qualquer está na fila (qualquer nível) */
function sectorsForEmployee(emp){
  const ids=[emp._key,emp.id].filter(v=>v!=null).map(String);
  const out=[];
  for(const tid in TASKS){
    const t=TASKS[tid];if(!t||t.active===false)continue;
    if((t.responsibles||[]).some(id=>ids.includes(String(id))))out.push(t.sectorId);
  }
  return out;
}
function computePartners(myTasks){
  const myIds=[state.emp._key,state.emp.id].filter(v=>v!=null).map(String);
  const partners={};
  for(const t of myTasks){
    const resp=t.responsibles||[];
    const myIdx=resp.findIndex(id=>myIds.includes(String(id)));
    resp.forEach((id,idx)=>{
      if(myIds.includes(String(id)))return;
      const key=String(id);
      partners[key]=partners[key]||{empId:id,together:0,asNext:0,asPrev:0};
      partners[key].together++;
      if(idx===myIdx+1)partners[key].asNext++;   // ele pega depois de você
      if(idx===myIdx-1)partners[key].asPrev++;   // você pega depois dele
    });
  }
  return Object.values(partners).sort((a,b)=>b.together-a.together);
}
/* todas as O.S. ativas (aberta/em_andamento) em que estou na fila — separadas entre responsável atual e co-responsável,
   usado em "Minhas responsabilidades" */
function myOSWithLevel(){
  if(!state.emp)return {mine:[],coresp:[]};
  const myIds=[state.emp._key,state.emp.id].filter(v=>v!=null).map(String);
  const mine=[],coresp=[];
  for(const osid in SERVICE_ORDERS){
    const os=SERVICE_ORDERS[osid];if(!os)continue;
    if(os.status!=="aberta"&&os.status!=="em_andamento")continue;
    const idx=(os.responsibles||[]).findIndex(id=>myIds.includes(String(id)));
    if(idx<0)continue;
    const current=osCurrentAssignee(os);
    const entry={osid,os,_level:idx+1};
    if(myIds.includes(String(current)))mine.push(entry);else coresp.push(entry);
  }
  const byPrio=(a,b)=>{
    const pr={urgente:0,normal:1,programada:2};
    const pa=pr[a.os.priority]??1,pb=pr[b.os.priority]??1;
    if(pa!==pb)return pa-pb;
    return (a.os.createdAt||0)-(b.os.createdAt||0);
  };
  mine.sort(byPrio);coresp.sort(byPrio);
  return {mine,coresp};
}
function osRespRow(osid,os,level){
  const today=todayKey();
  const isLate=!!os.deadline&&os.status!=="concluida"&&os.status!=="cancelada"&&os.deadline<today;
  return `<div class="resp-task-row" data-act="open-os-detail" data-osid="${osid}" style="cursor:pointer">
    <div class="rlevelbig">R${level}</div>
    <div class="rmain"><span class="rtitle">${esc(os.title)}</span>
      <div class="rmeta"><span class="chip sector">${esc(sectorName(os.sectorId))}</span>
        ${osPriorityChip(os.priority)}${osStatusBadge(os.status)}
        ${os.deadline?`<span class="chip${isLate?" late":""}">📅 ${fmtDate(os.deadline)}</span>`:""}</div>
    </div></div>`;
}
function viewResp(){
  if(!state.emp)return `<div class="empty"><b>Disponível só para colaboradores.</b>Faça login com seu CPF para ver suas responsabilidades.</div>`;
  const myCpfNorm=empCpfKey(state.emp);
  const scoreHtml=myCpfNorm?scoreCardHtml(myCpfNorm):"";
  const all=myActiveTasksWithLevel();
  const {mine:osMine,coresp:osCoresp}=myOSWithLevel();
  if(!all.length&&!osMine.length&&!osCoresp.length){
    return scoreHtml+`<div class="empty"><b>Você ainda não está na fila de nenhuma tarefa ou O.S.</b>Quando o gestor te adicionar como responsável, aparece aqui.</div>`;
  }
  let h=scoreHtml;

  if(all.length){
    // ---- resumo por nível (sobre TODAS as suas tarefas, ignora filtro) ----
    const byLevelCount={};all.forEach(t=>byLevelCount[t._level]=(byLevelCount[t._level]||0)+1);
    const levels=Object.keys(byLevelCount).map(Number).sort((a,b)=>a-b);
    const lvlClass=l=>l===1?"r1":l===2?"r2":"r3";
    h+=`<div class="section-title" style="margin-top:4px">Visão geral</div><div class="stat-grid">`;
    h+=`<div class="stat-box"><div class="num">${all.length}</div><div class="lbl">Tarefas no total</div></div>`;
    for(const l of levels)h+=`<div class="stat-box ${lvlClass(l)}"><div class="num">${byLevelCount[l]}</div><div class="lbl">Você é R${l}</div></div>`;
    h+="</div>";

    // ---- distribuição por setor: % arredondado a inteiros e sempre soma 100 ----
    const secCounts={};all.forEach(t=>{const k=String(t.sectorId||"");secCounts[k]=(secCounts[k]||0)+1});
    const secEntries=Object.entries(secCounts).sort((a,b)=>b[1]-a[1]);
    const rawPct=secEntries.map(([id,n])=>n/all.length*100);
    const pctInt=rawPct.map(Math.floor);
    let remainder=100-pctInt.reduce((s,v)=>s+v,0);
    // distribui o resto do arredondamento pelos maiores restos fracionários, pra somar exatamente 100
    const order=rawPct.map((v,i)=>({i,frac:v-pctInt[i]})).sort((a,b)=>b.frac-a.frac);
    for(let k=0;k<remainder;k++)pctInt[order[k%order.length].i]++;
    const secRows=secEntries.map(([id,n],i)=>({id,n,pct:pctInt[i]}));

    h+=`<div class="section-title">Sua distribuição por setor</div>`;
    if(secRows.length===1){
      h+=`<p class="note" style="margin:-2px 2px 10px">Todas as suas ${all.length} tarefa(s) são do setor <b>${esc(sectorName(secRows[0].id))}</b>.</p>`;
    }else{
      for(const r of secRows){
        h+=`<div class="bar-row"><span class="blabel">${esc(sectorName(r.id))}</span>
          <span class="bar-track"><span class="bar-fill" style="width:${r.pct}%"></span></span>
          <span class="bar-pct">${r.pct}% (${r.n})</span></div>`;
      }
    }

    // ---- parceiros (sobre todas) — clicável para ver tarefas em comum ----
    const partners=computePartners(all);
    if(partners.length){
      h+=`<div class="section-title">Sua rede de parceiros</div>
        <div class="partner-list">`;
      for(const p of partners){
        const emp=employeeById(p.empId);const nm=empName(emp)||"—";
        h+=`<button type="button" class="partner-line" data-act="show-partner" data-emp="${esc(p.empId)}">
          <span class="partner-line-name">${esc(nm)}</span><span class="partner-line-count">${p.together}</span></button>`;
      }
      h+=`</div>`;
    }

    // ---- filtros ----
    const F=state.respFilter;
    const usedSectors=[...new Set(all.map(t=>String(t.sectorId||"")))];
    const secOpts=`<option value="">Todos os setores</option>`+usedSectors.map(id=>`<option value="${esc(id)}" ${F.sector===id?"selected":""}>${esc(sectorName(id))}</option>`).join("");
    const lvlOpts=`<option value="">Todos os níveis</option>`+levels.map(l=>`<option value="${l}" ${String(F.level)===String(l)?"selected":""}>R${l}</option>`).join("");
    const hasFilter=F.sector||F.level;
    h+=`<div class="section-title">Suas tarefas</div>`;
    h+=`<div class="filters">
      <select data-filter2="sector">${secOpts}</select>
      <select data-filter2="level">${lvlOpts}</select>
      ${hasFilter?`<button class="btn sm ghost" data-act="clear-resp-filters">Limpar</button>`:""}
    </div>`;

    const filtered=all.filter(t=>{
      if(F.sector&&String(t.sectorId||"")!==F.sector)return false;
      if(F.level&&String(t._level)!==String(F.level))return false;
      return true;
    }).sort((a,b)=>a._level-b._level||a.title.localeCompare(b.title,"pt-BR"));

    if(!filtered.length){
      h+=`<div class="empty"><b>Nenhuma tarefa com esses filtros.</b>Ajuste ou limpe os filtros acima.</div>`;
    }else{
      for(const t of filtered){
        const natureLabels={executar:"A executar",demanda:"Sob demanda",continua:"Preocupação contínua"};
        h+=`<div class="resp-task-row">
          <div class="rlevelbig">R${t._level}</div>
          <div class="rmain"><span class="rtitle">${esc(t.title)}</span>
            <div class="rmeta"><span class="chip sector">${esc(sectorName(t.sectorId))}</span>
              <span class="chip">${esc(natureLabels[t.nature||"executar"])}</span>
              <span class="chip">${recurrenceLabel(t.recurrence||{type:"daily",interval:1})}</span>${t.startTime?`<span class="chip time">🕐 ${esc(t.startTime)}</span>`:""}</div>
          </div></div>`;
      }
    }
  }

  // ---- Ordens de serviço: responsável e co-responsável, em blocos separados ----
  if(osMine.length){
    h+=`<div class="section-title">Ordens de serviço — você é responsável <span class="count-pill">${osMine.length}</span></div>`;
    h+=osMine.map(e=>osRespRow(e.osid,e.os,e._level)).join("");
  }
  if(osCoresp.length){
    h+=`<div class="section-title">Ordens de serviço — você é co-responsável <span class="count-pill">${osCoresp.length}</span></div>`;
    h+=osCoresp.map(e=>osRespRow(e.osid,e.os,e._level)).join("");
  }

  return h;
}

function viewTeam(){

  const today=todayKey();
  const F=state.teamFilter;
  const rows=[];
  for(const iid in INSTANCES){
    const ins=INSTANCES[iid];if(!ins||ins.date!==today||ins.status==="adiada")continue;
    const task=TASKS[ins.taskId];if(!task||task.active===false)continue;
    rows.push({iid,ins,task});
  }
  const osRows=[];
  for(const osid in SERVICE_ORDERS){
    const os=SERVICE_ORDERS[osid];if(!os||(os.status!=="aberta"&&os.status!=="em_andamento"))continue;
    osRows.push({osid,os});
  }
  const usedSectors=[...new Set([...rows.map(r=>String(r.task.sectorId||"")),...osRows.map(r=>String(r.os.sectorId||""))])];
  const secOpts=`<option value="">Todos os setores</option>`+usedSectors.map(id=>`<option value="${esc(id)}" ${F.sector===id?"selected":""}>${esc(sectorName(id))}</option>`).join("");
  const usedEmpIds=[...new Set([
    ...rows.map(r=>String(r.ins.assignedTo||"")),
    ...osRows.map(r=>String(osCurrentAssignee(r.os)||""))
  ].filter(Boolean))];
  const empList=usedEmpIds.map(id=>({id,name:empName(employeeById(id))})).filter(e=>e.name&&e.name!=="—").sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"));
  const hasFilter=F.sector||F.emp;

  let h=`<div class="filters">
    <select data-filter-team="sector">${secOpts}</select>
    ${empComboHtml("filterEmpTeam",empList,{mode:"filter",placeholder:"Buscar colaborador…",resetLabel:"Todos os colaboradores",currentLabel:F.emp?(empList.find(e=>String(e.id)===String(F.emp))||{}).name||"":""})}
    ${hasFilter?`<button class="btn sm ghost" data-act="clear-team-filters">Limpar</button>`:""}
  </div>`;

  const filtered=rows.filter(({ins,task})=>{
    if(F.sector&&String(task.sectorId||"")!==F.sector)return false;
    if(F.emp&&String(ins.assignedTo||"")!==F.emp)return false;
    return true;
  }).sort((a,b)=>a.task.title.localeCompare(b.task.title,"pt-BR"));
  const osFiltered=osRows.filter(({os})=>{
    if(F.sector&&String(os.sectorId||"")!==F.sector)return false;
    if(F.emp&&String(osCurrentAssignee(os)||"")!==F.emp)return false;
    return true;
  }).sort((a,b)=>a.os.title.localeCompare(b.os.title,"pt-BR"));

  // ---- Tarefas ----
  h+=`<div class="section-title" style="margin-top:0">Tarefas de hoje da equipe <span class="count-pill">${filtered.length}${filtered.length!==rows.length?" de "+rows.length:""}</span></div>`;
  if(!rows.length){
    h+=`<div class="empty"><b>Nenhuma tarefa materializada hoje ainda.</b>Peça pra alguém abrir "Minhas tarefas" primeiro, ou volte mais tarde.</div>`;
  }else if(!filtered.length){
    h+=`<div class="empty"><b>Nenhuma tarefa com esses filtros.</b>Ajuste ou limpe os filtros acima.</div>`;
  }else{
    const teamCard=({iid,ins,task})=>{
      const respName=ins.assignedTo?empName(employeeById(ins.assignedTo)):null;
      return `<div class="tcard"><div class="tcard-head"><div>
        <h3>${esc(task.title)}</h3>
        <div class="small">${esc(sectorName(task.sectorId))}${task.startTime?` · 🕐 ${esc(task.startTime)}`:""}</div>
        <div class="meta" style="margin-top:6px">${statusBadge(ins.status)}<span class="chip">${respName?esc(respName):"Sem responsável elegível hoje"}</span></div>
      </div></div>
      ${(ins.status==="pendente"||ins.status==="em_andamento")?`<div class="actions"><button class="btn sm" data-act="transfer-team" data-iid="${iid}">Transferir</button></div>`:""}
      </div>`;
    };
    const statusGroups=[
      ["em_andamento","🔵","Em andamento"],
      ["pendente","⏳","Pendente"],
      ["nao_realizada","⚠️","Não realizada"],
      ["concluida","✅","Concluída"],
    ];
    for(const [st,icon,label] of statusGroups){
      const group=filtered.filter(r=>r.ins.status===st);
      if(!group.length)continue;
      h+=dayBlockHead(st,icon,label,null,group.length);
      h+=group.map(teamCard).join("");
    }
    // qualquer status fora do mapa acima (segurança contra status novo/inesperado) ainda aparece, sem ficar escondido
    const known=new Set(statusGroups.map(g=>g[0]));
    const leftover=filtered.filter(r=>!known.has(r.ins.status));
    if(leftover.length){
      h+=dayBlockHead("outro","❔","Outros",null,leftover.length);
      h+=leftover.map(teamCard).join("");
    }
  }

  // ---- Ordens de serviço ----
  h+=`<div class="section-title">Ordens de serviço da equipe <span class="count-pill">${osFiltered.length}${osFiltered.length!==osRows.length?" de "+osRows.length:""}</span></div>`;
  if(!osRows.length){
    h+=`<div class="empty"><b>Nenhuma O.S. ativa no momento.</b></div>`;
  }else if(!osFiltered.length){
    h+=`<div class="empty"><b>Nenhuma O.S. com esses filtros.</b>Ajuste ou limpe os filtros acima.</div>`;
  }else{
    const teamOSCard=({osid,os})=>{
      const assignee=osCurrentAssignee(os);
      const respName=assignee?empName(employeeById(assignee)):null;
      const isLate=!!os.deadline&&os.deadline<today;
      return `<div class="tcard"><div class="tcard-head"><div>
        <h3>${esc(os.title)}</h3>
        <div class="small">${esc(sectorName(os.sectorId))}${os.requester?" · "+esc(os.requester):""}</div>

      </div></div>
      <div class="actions"><button class="btn sm" data-act="transfer-team-os" data-osid="${osid}">Transferir</button></div>
      </div>`;
    };
    const osStatusGroups=[["em_andamento","🔵","Em andamento"],["aberta","⏳","Abertas"]];
    for(const [st,icon,label] of osStatusGroups){
      const group=osFiltered.filter(r=>r.os.status===st);
      if(!group.length)continue;
      h+=dayBlockHead(st,icon,label,null,group.length);
      h+=group.map(teamOSCard).join("");
    }
  }

  return h;
}

  for(const [osid,o] of list){

    const respLabel=(o.responsibles||[]).map((id,i)=>`R${i+1} ${esc(empName(employeeById(id)))}`).join(" · ")||"—";
    const assigneeNow=o.status==="em_andamento"?o.assignedTo:(o.status==="aberta"?osCurrentAssignee(o):null);
    const discChip=`<span class="chip" data-act="open-discussion" data-type="os" data-id="${esc(osid)}" style="cursor:pointer">💬${threadHasUnread("os",osid)?' <span class="badge-dot"></span>':""}</span>`;
    h+=`<div class="tcard" data-act="open-os-detail" data-osid="${osid}" style="cursor:pointer"><div class="tcard-head"><div>
      <h3>${esc(o.title)}</h3>
      <div class="small">${esc(sectorName(o.sectorId))}${o.requester?" · "+esc(o.requester):""}</div>
      <div class="meta" style="margin-top:6px">${osStatusBadge(o.status)}${osPriorityChip(o.priority)}${o.deadline?`<span class="chip${isLate?" late":""}">📅 ${fmtDate(o.deadline)}</span>`:""}${discChip}</div>
    </div></div>
    <div class="small" style="margin-top:8px">Fila: ${respLabel}${assigneeNow?` · Responsável agora: <b>${esc(empName(employeeById(assigneeNow)))}</b>`:""}</div>
    </div>`;
  }
  return h;
}
function viewAdmin(){
  const today=todayKey();
  const F=state.adminFilter;
  const all=Object.entries(TASKS).filter(([,t])=>t.active!==false);
  const natureLabels={executar:"A executar",demanda:"Sob demanda",continua:"Preocupação contínua"};

  // colaboradores que aparecem em alguma fila (para o filtro)
  const usedEmp=new Set();
  all.forEach(([,t])=>(t.responsibles||[]).forEach(id=>usedEmp.add(String(id))));
  const empOpts=[...usedEmp].map(id=>({id,name:empName(employeeById(id))}))
    .filter(e=>e.name&&e.name!=="—").sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"));

  // status "de hoje" de cada tarefa (para exibir e para filtrar)
  const todayStatusOf=(tid,t)=>{
    if(!occursOn(t,today))return "nao_ocorre";
    const ins=INSTANCES[`${tid}__${today}`];
    const assignee=ins?ins.assignedTo:computeAssignee(t,today);
    if(!assignee)return "sem_responsavel";
    return ins?ins.status:"pendente";
  };

  // aplica filtros
  const list=all.filter(([tid,t])=>{
    if(F.sector&&String(t.sectorId)!==String(F.sector))return false;
    const respIdx=F.emp?(t.responsibles||[]).findIndex(id=>String(id)===String(F.emp)):-2;
    if(F.emp&&respIdx<0)return false; // colaborador não está nessa fila
    if(F.level){
      if(F.emp){
        if(respIdx+1!==Number(F.level))return false; // precisa estar EXATAMENTE nesse nível
      }else{
        if((t.responsibles||[]).length<Number(F.level))return false; // a fila precisa ter esse nível
      }
    }
    if(F.status&&todayStatusOf(tid,t)!==F.status)return false;
    if(F.nature&&(t.nature||"executar")!==F.nature)return false;
    return true;
  });

  // resumo de hoje (sempre sobre todas as tarefas)
  let pend=0,prog=0,done=0,unassigned=0,notDone=0;
  for(const iid in INSTANCES){const ins=INSTANCES[iid];if(!ins||ins.date!==today)continue;const t=TASKS[ins.taskId];if(!t||t.active===false)continue;
    if(ins.status==="concluida")done++;
    else if(ins.status==="nao_realizada")notDone++;
    else if(ins.status==="em_andamento")prog++;
    else if(ins.status==="pendente"){pend++;if(!ins.assignedTo)unassigned++}}

  const maxLevel=Math.max(1,...all.map(([,t])=>(t.responsibles||[]).length));
  const levelOpts=`<option value="">Todos os níveis</option>`+Array.from({length:maxLevel},(_,i)=>i+1)
    .map(l=>`<option value="${l}" ${String(F.level)===String(l)?"selected":""}>R${l}${F.emp?"":" (fila com "+l+"+)"}</option>`).join("");
  const secOpts=`<option value="">Todos os setores</option>`+sectors().map(s=>`<option value="${esc(s.id)}" ${String(s.id)===String(F.sector)?"selected":""}>${esc(pick(s,SCHEMA.nameFields)||s._key)}</option>`).join("");
  const statusLabels={pendente:"Pendente hoje",em_andamento:"Em andamento",concluida:"Concluída hoje",adiada:"Adiada",nao_realizada:"Não realizada hoje",sem_responsavel:"Sem responsável",nao_ocorre:"Não ocorre hoje"};
  const statusOpts=`<option value="">Todos os status</option>`+Object.entries(statusLabels).map(([v,l])=>`<option value="${v}" ${F.status===v?"selected":""}>${l}</option>`).join("");
  const natureOpts=`<option value="">Todas as naturezas</option>`+Object.entries(natureLabels).map(([v,l])=>`<option value="${v}" ${F.nature===v?"selected":""}>${l}</option>`).join("");
  const hasFilter=F.sector||F.emp||F.status||F.nature||F.level;

  let h=`<div class="diag"><div class="kv">
    <span>Hoje:</span> <b>${pend}</b> <span>pendentes</span>
    <b>${prog}</b> <span>em andamento</span>
    <b>${done}</b> <span>concluídas</span>
    ${notDone?`<b>${notDone}</b> <span>não realizadas</span>`:""}
    ${unassigned?`<b style="color:var(--accent)">${unassigned}</b> <span>sem responsável elegível</span>`:""}
  </div><div class="actions">
    <button class="btn sm" data-act="recalc">↻ Recalcular fila de hoje</button>
    <button class="btn sm" data-act="open-report">📋 Relatório do dia</button>
  </div></div>`;

  const unreadDiscKeys=Object.keys(DISCUSSIONS).filter(key=>{
    const th=DISCUSSIONS[key];if(!th)return false;
    const msgs=th.messages||[];if(!msgs.length)return false;
    const last=msgs[msgs.length-1];
    if(String(last.by)===String(state.user.username))return false;
    const readAt=(th.readBy&&th.readBy[state.user.username])||0;
    return last.at>readAt;
  });
  if(unreadDiscKeys.length){
    h+=`<button type="button" class="btn-suggest has-open" style="width:100%;justify-content:center;padding:10px;margin-bottom:14px;font-size:13.5px" data-act="goto-discussions">
      💬 ${unreadDiscKeys.length} discussão(ões) com mensagem não lida — toque para ver</button>`;
  }

  h+=`<div class="filters">
    <select data-filter="sector">${secOpts}</select>
    ${empComboHtml("filterEmpAdmin",empOpts,{mode:"filter",placeholder:"Buscar colaborador…",resetLabel:"Todos os colaboradores",currentLabel:F.emp?(empOpts.find(e=>String(e.id)===String(F.emp))||{}).name||"":""})}
    <select data-filter="level">${levelOpts}</select>
    <select data-filter="status">${statusOpts}</select>
    <select data-filter="nature">${natureOpts}</select>
    ${hasFilter?`<button class="btn sm ghost" data-act="clear-filters">Limpar</button>`:""}
  </div>`;
  h+=F.emp&&F.level?`<p class="note" style="margin:-4px 2px 12px">Mostrando tarefas onde <b>${esc(empName(employeeById(F.emp)))}</b> é exatamente R${F.level}.</p>`:"";

  h+=`<div class="section-title">Tarefas <span class="count-pill">${list.length}${list.length!==all.length?" de "+all.length:""}</span></div>`;
  if(!all.length){h+=`<div class="empty"><b>Nenhuma tarefa cadastrada.</b>Toque em "Nova tarefa" para começar.</div>`;return h}
  if(!list.length){h+=`<div class="empty"><b>Nenhuma tarefa com esses filtros.</b>Ajuste ou limpe os filtros acima.</div>`;return h}

  for(const [tid,t] of list){
    const resp=(t.responsibles||[]).map((id,i)=>`R${i+1} ${esc(empName(employeeById(id)))}`).join(" · ")||"—";
    const nature=t.nature||"executar";

    // responsável de HOJE, em destaque
    let todayRow;
    if(occursOn(t,today)){
      const ins=INSTANCES[`${tid}__${today}`];
      const assignee=ins?ins.assignedTo:computeAssignee(t,today);
      const status=ins?ins.status:"pendente";
      if(assignee){
        const nm=empName(employeeById(assignee))||"—";
        const ini=esc(nm.trim().charAt(0).toUpperCase()||"?");
        todayRow=`<div class="today-row"><span class="avatar">${ini}</span>
          <div class="today-info"><span class="today-label">Responsável hoje</span><span class="today-name">${esc(nm)}</span></div>
          ${statusBadge(status)}</div>`;
      }else{
        todayRow=`<div class="today-row none"><span class="avatar none">!</span>
          <div class="today-info"><span class="today-label">Hoje</span><span class="today-name">Sem responsável elegível</span></div></div>`;
      }
    }else{
      todayRow=`<div class="today-row muted"><div class="today-info"><span class="today-name" style="color:var(--muted);font-weight:500">Não ocorre hoje</span></div></div>`;
    }

    // tarefas executar com instâncias atrasadas (pendente/em_andamento de dias anteriores)
    let lateInfo="";
    if(nature==="executar"){
      let oldest=null;
      for(const iid in INSTANCES){
        const ins=INSTANCES[iid];if(!ins||ins.taskId!==tid)continue;
        if((ins.status==="pendente"||ins.status==="em_andamento")&&ins.date<today){
          if(!oldest||ins.date<oldest)oldest=ins.date;
        }
      }
      if(oldest)lateInfo=`<span class="chip late">${daysBetween(oldest,today)} dia(s) em atraso</span>`;
    }

    const discChip=`<span class="chip" data-act="open-discussion" data-type="task" data-id="${esc(tid)}" style="cursor:pointer">💬${threadHasUnread("task",tid)?' <span class="badge-dot"></span>':""}</span>`;
    const todayIid=`${tid}__${today}`;
    const hasToday=!!INSTANCES[todayIid];
    h+=`<div class="tcard"><div class="tcard-head"><div>
      <h3>${esc(t.title)}</h3>
      <div class="small">${esc(sectorName(t.sectorId))} · ${recurrenceLabel(t.recurrence||{type:"daily",interval:1})}${t.startTime?` · 🕐 ${esc(t.startTime)}`:""}</div>
      <div class="meta" style="margin-top:6px"><span class="chip">${esc(natureLabels[nature])}</span>${lateInfo}${discChip}</div>
    </div></div>
    ${todayRow}
    <div class="small" style="margin-top:8px">Fila: ${resp}</div>
    <div class="actions">
      ${hasToday?`<button class="btn sm ghost" data-act="open-task-history" data-iid="${esc(todayIid)}">Ver histórico</button>`:""}
      <button class="btn sm" data-act="edit-task" data-tid="${tid}">Editar</button>
      <button class="btn sm danger" data-act="del-task" data-tid="${tid}">Excluir</button>
    </div></div>`;
  }
  return h;
}

/* ---------- Desempenho da equipe (gestor) ---------- */
function viewPerformance(){
  const today=todayKey();
  const F=state.perfFilter;
  const ALERT_THRESHOLD=15; // pontos percentuais de variação p/ disparar alerta
  const allEmps=employees().filter(e=>empCpfKey(e));
  if(!allEmps.length)return `<div class="empty"><b>Nenhum colaborador com CPF cadastrado ainda.</b>A nota depende do CPF estar vinculado ao funcionário.</div>`;

  const weeksN=Number(F.weeks)||4;
  const weeks=lastNMondays(today,weeksN);

  // nota de cada colaborador, semana a semana, no período escolhido
  const empData=allEmps.map(emp=>{
    const cpfNorm=empCpfKey(emp);
    const series=buildSeries([cpfNorm],weeks,today);
    const avg=avgIgnoringNulls(series.map(p=>p.pct));
    const cur=currentWeekScore(cpfNorm,today);
    const prev=previousClosedWeekScore(cpfNorm,today);
    const sectorIds=[...new Set(sectorsForEmployee(emp).map(sid=>String(sid||"")))];
    return {emp,cpfNorm,series,avg,cur,prev,sectorIds};
  });

  // ---- visão geral: média da equipe no período ----
  const teamAvg=avgIgnoringNulls(empData.map(r=>r.avg));

  // ---- alertas: variação >= limiar entre semana atual (parcial) e a nota fechada da semana anterior ----
  const alerts=empData.filter(r=>r.cur.pct!=null&&r.prev.pct!=null&&Math.abs(r.cur.pct-r.prev.pct)>=ALERT_THRESHOLD)
    .sort((a,b)=>Math.abs(b.cur.pct-b.prev.pct)-Math.abs(a.cur.pct-a.prev.pct));

  // ---- setores (lista usada nos filtros e no ranking) ----
  const usedSectors=sectors().filter(s=>empData.some(r=>r.sectorIds.includes(String(s.id))));

  // ---- série do GRÁFICO: depende do filtro (1 pessoa = linha dela; setor/todos = média do grupo) ----
  let graphCpfs,graphLabel;
  if(F.emp){
    const r=empData.find(x=>String(x.emp.id)===String(F.emp));
    graphCpfs=r?[r.cpfNorm]:[];
    graphLabel=r?empName(r.emp):"";
  }else if(F.sector){
    const inSector=empData.filter(r=>r.sectorIds.includes(F.sector));
    graphCpfs=inSector.map(r=>r.cpfNorm);
    graphLabel="Média de "+esc(sectorName(F.sector));
  }else{
    graphCpfs=empData.map(r=>r.cpfNorm);
    graphLabel="Média de todos os colaboradores";
  }
  const graphSeries=buildSeries(graphCpfs,weeks,today);

  // ---- filtros (afetam o gráfico) ----
  const secOpts=`<option value="">Todos os setores</option>`+usedSectors.map(s=>`<option value="${esc(s.id)}" ${F.sector===String(s.id)?"selected":""}>${esc(pick(s,SCHEMA.nameFields)||s._key)}</option>`).join("");
  const empOpts=empOptionsSorted(allEmps);
  const hasFilter=F.sector||F.emp;
  const weekOpts=[4,8,12].map(n=>`<button type="button" class="${weeksN===n?"on":""}" data-act="set-perf-weeks" data-n="${n}">${n} semanas</button>`).join("");

  let h=`<div class="diag"><div class="kv">
    <span>Média da equipe (período):</span> <b style="font-size:18px">${teamAvg!=null?teamAvg+"%":"sem dados"}</b>
  </div><p class="note" style="margin-top:6px">${weekLabel(weeks[0]).split(" – ")[0]} – ${weekLabel(weeks[weeks.length-1]).split(" – ")[1]} · a semana mais recente ainda está em andamento</p></div>`;

  if(alerts.length){
    h+=`<div class="section-title">Pontos de atenção</div>`;
    for(const r of alerts){
      const diff=r.cur.pct-r.prev.pct;
      const type=diff>0?"up":"down";
      const verb=diff>0?"subiu":"caiu";
      h+=`<div class="alert-card ${type}"><span>${type==="up"?"📈":"📉"}</span>
        <div><b>${esc(empName(r.emp))}</b>${verb} ${Math.abs(diff)} pontos em relação à nota final da semana passada: ${r.prev.pct}% → ${r.cur.pct}%</div></div>`;
    }
  }

  // ---- gráfico de evolução ----
  h+=`<div class="section-title">Evolução</div>
    <div class="period-bar">${weekOpts}</div>
    <div class="filters">
      <select data-filter3="sector">${secOpts}</select>
      ${empComboHtml("filterEmpPerf",empOpts,{mode:"filter",placeholder:"Buscar colaborador…",resetLabel:"Todos os colaboradores",currentLabel:F.emp?(empOpts.find(e=>String(e.id)===String(F.emp))||{}).name||"":""})}
      ${hasFilter?`<button class="btn sm ghost" data-act="clear-perf-filters">Limpar</button>`:""}
    </div>
    <div class="diag">${lineChartSvg(graphSeries)}
      <p class="note" style="margin-top:6px;text-align:center">${graphLabel}</p>
    </div>`;

  // ---- ranking de funcionários (pela média do período) ----
  const rankedEmps=empData.filter(r=>r.avg!=null).sort((a,b)=>b.avg-a.avg);
  h+=`<div class="rank-box"><div class="rank-box-head"><h4>🏆 Ranking de colaboradores</h4><span>média de ${weeksN} semanas</span></div>`;
  if(!rankedEmps.length){
    h+=`<p class="note" style="padding:0 15px 13px">Sem dados suficientes ainda neste período.</p>`;
  }else{
    h+=`<div class="rank-scroll">`+rankedEmps.map((r,i)=>{
      const cls=scoreClass(r.avg);
      return `<button type="button" class="rank-line" data-act="open-perf-detail" data-id="${esc(r.emp.id)}">
        <span class="rank-pos ${i<3?"top":""}">${i+1}º</span>
        <div class="rank-main"><div class="rank-name">${esc(empName(r.emp))}</div>
          <div class="rank-sub">semana atual: ${r.cur.pct!=null?r.cur.pct+"%":"sem dados"}</div></div>
        <div class="perf-pct ${cls}">${r.avg}%</div>
      </button>`;
    }).join("")+`</div>`;
  }
  h+=`</div>`;

  // ---- ranking de setores (média do período, sobre as médias dos colaboradores daquele setor) ----
  const secAvg={};
  for(const r of empData){
    if(r.avg==null)continue;
    for(const sid of r.sectorIds){(secAvg[sid]=secAvg[sid]||[]).push(r.avg)}
  }
  const rankedSectors=Object.entries(secAvg).map(([sid,arr])=>({sid,avg:avgIgnoringNulls(arr),n:arr.length}))
    .sort((a,b)=>b.avg-a.avg);
  h+=`<div class="rank-box"><div class="rank-box-head"><h4>🏢 Ranking de setores</h4><span>média de ${weeksN} semanas</span></div>`;
  if(!rankedSectors.length){
    h+=`<p class="note" style="padding:0 15px 13px">Sem dados suficientes ainda neste período.</p>`;
  }else{
    h+=`<div class="rank-scroll">`+rankedSectors.map((r,i)=>{
      const cls=scoreClass(r.avg);
      return `<div class="rank-line" style="cursor:default">
        <span class="rank-pos ${i<3?"top":""}">${i+1}º</span>
        <div class="rank-main"><div class="rank-name">${esc(sectorName(r.sid))}</div>
          <div class="rank-sub">${r.n} colaborador(es)</div></div>
        <div class="perf-pct ${cls}">${r.avg}%</div>
      </div>`;
    }).join("")+`</div>`;
  }
  h+=`</div>`;

  // ---- Ordens de serviço: resumo à parte, não entra na nota semanal de rotina ----
  const osAll=Object.values(SERVICE_ORDERS);
  if(osAll.length){
    const osOpen=osAll.filter(o=>o.status==="aberta").length;
    const osProg=osAll.filter(o=>o.status==="em_andamento").length;
    const osDone=osAll.filter(o=>o.status==="concluida").length;
    const osLate=osAll.filter(o=>o.deadline&&o.status!=="concluida"&&o.status!=="cancelada"&&o.deadline<today).length;
    h+=`<div class="section-title">Ordens de serviço</div>
    <div class="stat-grid">
      <div class="stat-box"><div class="num">${osOpen}</div><div class="lbl">Abertas</div></div>
      <div class="stat-box"><div class="num">${osProg}</div><div class="lbl">Em andamento</div></div>
      <div class="stat-box"><div class="num">${osDone}</div><div class="lbl">Concluídas</div></div>
      ${osLate?`<div class="stat-box r3"><div class="num">${osLate}</div><div class="lbl">Atrasadas</div></div>`:""}
    </div>`;
  }

  h+=`<div class="actions" style="margin-top:6px"><button class="btn sm danger" data-act="reset-scores">🗑 Zerar notas semanais</button></div>`;

  return h;
}
/* SVG de linha simples para a série de pontos semanais (1 ponto = 1 semana) */
function lineChartSvg(points){
  const valid=points.map((p,i)=>({...p,i})).filter(p=>p.pct!=null);
  if(valid.length<2)return `<p class="note">Ainda não há semanas suficientes neste período para mostrar o gráfico.</p>`;
  const W=320,H=130,pad=10;
  const stepX=points.length>1?(W-pad*2)/(points.length-1):0;
  const xy=valid.map(p=>({x:pad+p.i*stepX,y:pad+(H-pad*2)*(1-p.pct/100),pct:p.pct,partial:p.partial}));
  const path=xy.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
  const dots=xy.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.partial?4.5:3.5}"
    fill="${p.partial?"var(--accent)":"var(--primary)"}" stroke="var(--surface)" stroke-width="1.5"/>`).join("");
  const labels=points.map((p,i)=>`<text x="${(pad+i*stepX).toFixed(1)}" y="${H-1}" font-size="8" fill="var(--muted-2)" text-anchor="middle">${parseKey(p.monday).getDate()}/${parseKey(p.monday).getMonth()+1}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" preserveAspectRatio="none">
    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad-10}" stroke="var(--line)" stroke-width="1"/>
    <line x1="${pad}" y1="${H-pad-10}" x2="${W-pad}" y2="${H-pad-10}" stroke="var(--line)" stroke-width="1"/>
    <path d="${path}" fill="none" stroke="var(--primary)" stroke-width="2"/>
    ${dots}${labels}
  </svg>`;
}

/* ---- Modal: detalhe de desempenho de um colaborador, com gráfico de evolução ---- */
function openPerfDetail(empId){
  const emp=employeeById(empId);if(!emp)return;
  const cpfNorm=empCpfKey(emp);
  const today=todayKey();
  const cur=currentWeekScore(cpfNorm,today);
  const closed=closedWeeksHistory(cpfNorm,8);
  const points=[...closed.map(w=>({label:weekLabel(w.monday),pct:w.pct,partial:false})),
    {label:weekLabel(mondayOf(today))+" (em andamento)",pct:cur.pct,partial:true}].filter(p=>p.pct!=null);

  let chart="";
  if(points.length>=2){
    const W=300,H=110,pad=8;
    const stepX=(W-pad*2)/(points.length-1);
    const xy=points.map((p,i)=>({x:pad+i*stepX,y:pad+(H-pad*2)*(1-p.pct/100)}));
    const path=xy.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
    const dots=xy.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${points[i].partial?4.5:3.5}"
      fill="${points[i].partial?"var(--accent)":"var(--primary)"}" stroke="var(--surface)" stroke-width="1.5"/>`).join("");
    chart=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin:10px 0 4px" preserveAspectRatio="none">
      <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="var(--line)" stroke-width="1"/>
      <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)" stroke-width="1"/>
      <path d="${path}" fill="none" stroke="var(--primary)" stroke-width="2"/>
      ${dots}
    </svg>`;
  }

/* ===================================================================
   MIGRAÇÃO: corrige responsáveis das tarefas após mudança de IDs no app de escala
   Lê /escala_lazer/employee_key_migration, traduz chaves antigas → novas,
   é idempotente (seguro rodar mais de uma vez).
   =================================================================== */
async function fixResponsibles(){
  if(!state.admin)return;
  if(!confirm("Isso vai traduzir os IDs dos responsáveis de todas as tarefas, usando o mapeamento gerado pelo botão 'Corrigir estrutura' no app de Escala.\n\nNão altera quais pessoas estão nas tarefas — só traduz o formato do identificador.\n\nConfirma?"))return;

  toast("Buscando mapeamento de migração…");

  // 1. buscar o mapeamento gerado pelo app de escala
  let migrationData;
  try{
    const snap=await dbRef("escala_lazer/employee_key_migration").once("value");
    migrationData=snap.val();
  }catch(e){
    alert("Erro ao acessar o banco: "+e.message);return;
  }
  if(!migrationData||!migrationData.mapping){
    alert("Mapeamento de migração não encontrado.\n\nO botão 'Corrigir estrutura' no app de Escala ainda não foi executado — peça ao gestor para fazer isso primeiro, depois tente novamente.");
    return;
  }

  const mapping=migrationData.mapping; // {"0":"12345678901","1":"joao_silva_a1b2c",...}
  const oldKeys=new Set(Object.keys(mapping));

  // 2. percorrer todas as tarefas e traduzir responsáveis com chave antiga
  const updates={};
  const report=[]; // [{taskTitle, r, oldKey, newKey}]

  for(const tid in TASKS){
    const task=TASKS[tid];
    if(!task||task.active===false)continue;
    const responsibles=task.responsibles||[];
    const newResponsibles=responsibles.map((id,i)=>{
      const s=String(id);
      if(oldKeys.has(s)){
        report.push({taskTitle:task.title,r:i+1,oldKey:s,newKey:mapping[s]});
        return mapping[s];
      }
      return id; // já está no formato novo, mantém como está
    });
    // só grava se algo mudou (evita escritas desnecessárias)
    if(JSON.stringify(responsibles.map(String))!==JSON.stringify(newResponsibles.map(String))){
      updates[`tasks/${tid}/responsibles`]=newResponsibles;
    }
  }

  if(!Object.keys(updates).length){
    alert(`Nenhuma tarefa precisou ser atualizada.\n\nTodos os IDs já estão no formato novo — a migração provavelmente já foi feita antes.`);
    return;
  }

  // 3. gravar no Firebase
  try{
    await dbRef(PATH.tarefas).update(updates);
  }catch(e){
    alert("Erro ao salvar as atualizações: "+e.message);return;
  }

  // 4. mostrar relatório
  const changed=Object.keys(updates).length;
  const lines=report.map(r=>`• ${esc(r.taskTitle)} — R${r.r}: ${r.oldKey} → ${r.newKey}`).join("\n");
  alert(`✓ Migração concluída!\n\n${changed} tarefa(s) atualizada(s), ${report.length} responsável(eis) traduzido(s).\n\n${lines}\n\nRecomendamos revisar manualmente os responsáveis de cada tarefa para confirmar que estão corretos.`);
  toast("Responsáveis migrados ✓");
}

/* Limpeza das pendências retroativas criadas pelo bug de materialização: instâncias de dias
   passados que nasceram MUITO depois da própria data (createdAt >> date) e nunca foram tocadas
   por ninguém (sem histórico, ainda pendentes). Uma ocorrência legítima nasce no dia dela ou
   pouco depois; essas nasceram semanas depois, quando alguém editou a recorrência da tarefa. */
function bogusBackfillInstances(){
  const today=todayKey();
  const out=[];
  for(const iid in INSTANCES){
    const ins=INSTANCES[iid];if(!ins||!ins.date||ins.date>=today)continue;
    if(ins.status!=="pendente")continue;                       // só as que nunca foram resolvidas
    if(Array.isArray(ins.history)&&ins.history.length)continue; // ninguém mexeu nela
    if(!ins.createdAt)continue;
    const criadaEm=dateKey(new Date(ins.createdAt));
    if(daysBetween(ins.date,criadaEm)<2)continue;              // nasceu no dia dela: legítima
    out.push({iid,date:ins.date,criadaEm,title:(TASKS[ins.taskId]||{}).title||"(tarefa removida)"});
  }
  out.sort((a,b)=>a.date<b.date?1:-1);
  return out;
}
function cleanBogusBackfill(){
  const list=bogusBackfillInstances();
  if(!list.length){toast("Nenhuma pendência retroativa encontrada.");return}
  if(!confirm(`Anular ${list.length} pendência(s) retroativa(s) criada(s) indevidamente?\n\nElas deixam de aparecer como atrasadas e não contam na nota de ninguém. Só são afetadas ocorrências de dias passados, ainda pendentes, sem nenhuma movimentação e que nasceram dias depois da própria data. Concluídas e não realizadas de verdade não são tocadas.`))return;
  const updates={};
  const hoje=todayKey();
  const tarefasAfetadas=new Set();
  for(const it of list){
    const ins=INSTANCES[it.iid];if(!ins)continue;
    // IMPORTANTE: não apagar. Um aparelho que ainda esteja com a versão antiga do app em cache
    // recriaria a ocorrência ausente na próxima materialização — foi por isso que as pendências
    // "voltavam" logo depois da limpeza. Marcando como terminal, a ocorrência continua existindo
    // (nenhum cliente a recria), some das atrasadas e, sem responsável, não pesa na nota.
    updates[`instances/${it.iid}/status`]="nao_realizada";
    updates[`instances/${it.iid}/assignedTo`]=null;
    updates[`instances/${it.iid}/autoExpired`]=true;
    updates[`instances/${it.iid}/voidedBackfill`]=true;
    const hist=Array.isArray(ins.history)?ins.history.slice():[];
    hist.push({type:"nao_realizada",by:"sistema",at:Date.now(),note:"Anulada: pendência retroativa criada por erro de materialização"});
    updates[`instances/${it.iid}/history`]=hist;
    if(ins.taskId&&TASKS[ins.taskId])tarefasAfetadas.add(ins.taskId);
  }
  for(const tid of tarefasAfetadas)updates[`tasks/${tid}/materializeFrom`]=hoje;
  dbRef(PATH.tarefas).update(updates).then(()=>{
    invalidateTerminalIndex();
    toast(`${list.length} pendência(s) indevida(s) anulada(s) ✓`);
  });
}

function weekdaysLabel(days){
  const sorted=[...new Set(days)].sort((a,b)=>a-b);
  if(sorted.length>=7)return "todos os dias da semana";
  if(sorted.length===1)return WEEKDAYS[sorted[0]];
  const isConsecutive=sorted.every((d,i)=>i===0||d===sorted[i-1]+1);
  if(isConsecutive&&sorted.length>=3)return `${WEEKDAYS[sorted[0]]} a ${WEEKDAYS[sorted[sorted.length-1]]}`;
  const names=sorted.map(d=>WEEKDAYS[d]);
  if(names.length===2)return `${names[0]} e ${names[1]}`;
  return names.slice(0,-1).join(", ")+" e "+names[names.length-1];
}
function recurrenceLabel(rec){
  const n=Math.max(1,Number(rec.interval)||1);
  if(rec.type==="weekly"){
    const days=Array.isArray(rec.weekdays)?rec.weekdays.map(Number):(rec.weekday!=null?[Number(rec.weekday)]:[1]);
    const lbl=weekdaysLabel(days);
    const base=days.length===1?`Toda(o) ${lbl}`:lbl.charAt(0).toUpperCase()+lbl.slice(1);
    return n===1?`${base}.`:`A cada ${n} semanas — ${lbl}.`;
  }
  if(rec.type==="monthly"){
    const d=rec.day||1;
    return n===1?`Todo dia ${d} do mês.`:`A cada ${n} meses, no dia ${d}.`;
  }
  return n===1?"Todos os dias.":`A cada ${n} dias.`;
}

/* junta as observações deixadas em TODAS as ocorrências passadas dessa tarefa (não só a de hoje),
   mais recente primeiro — usado no detalhe da tarefa */
function taskObservationHistory(taskId){
  const items=[];
  for(const iid in INSTANCES){
    const ins=INSTANCES[iid];if(!ins||ins.taskId!==taskId||!ins.completionNote)continue;
    const hist=Array.isArray(ins.history)?ins.history:[];
    const entry=hist.slice().reverse().find(h=>h.note&&(h.type==="concluida"||h.type==="nao_realizada"));
    const by=entry?entry.by:null;
    const who=by?(by==="sistema"?"Sistema":(by==="gestor"||/gestor/i.test(by)?"Gestor":(empName(employeeByCpf(by))!=="—"?empName(employeeByCpf(by)):by))):"—";
    items.push({date:ins.date,note:ins.completionNote,who,at:entry?entry.at:(ins.completedAt||0),status:ins.status});
  }
  items.sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:(b.at||0)-(a.at||0)));
  return items;
}

  }).join(""):'<p class="note">Sem movimentações ainda.</p>';

  // em modo consulta (ex.: "Ver histórico" na lista do gestor) o modal é só leitura — os botões de

  const obsHistory=taskObservationHistory(ins.taskId);

/* ---- Relatório do dia: movimentações de hoje, agrupadas por colaborador ---- */
function openDailyReport(){
  const today=todayKey();
  const startOfDay=parseKey(today).getTime();
  const endOfDay=startOfDay+86400000;
  const byEmp={}; // username -> [{time,label,taskTitle,extra}]
  const moveLabels={iniciada:"Iniciou",concluida:"Concluiu",nao_realizada:"Marcou não realizada",reaberta:"Reabriu",transferida:"Transferiu",adiada:"Adiou",
    "recebida-adiamento":"Recebeu (adiamento)"};
  for(const iid in INSTANCES){
    const ins=INSTANCES[iid];if(!ins||!Array.isArray(ins.history))continue;
    const task=TASKS[ins.taskId];const title=task?task.title:"(tarefa removida)";
    for(const h of ins.history){
      if(!h.at||h.at<startOfDay||h.at>=endOfDay)continue;
      const who=h.by||"—";
      let extra="";
      if(h.type==="transferida")extra=` → ${empName(employeeById(h.to))||h.to}`;
      if(h.type==="adiada")extra=` → ${fmtDate(h.to)}`;
      if(h.note)extra+=` ("${h.note}")`;
      (byEmp[who]=byEmp[who]||[]).push({time:h.at,label:moveLabels[h.type]||h.type,title,extra});
    }
  }
  const emps=Object.keys(byEmp).sort((a,b)=>byEmp[b].length-byEmp[a].length);
  let body=`<p class="note" style="margin-bottom:14px">Movimentações de hoje (${fmtDate(today)}), por colaborador. Login usado no app (CPF) identifica quem fez a ação.</p>`;
  if(!emps.length){
    body+=`<div class="empty"><b>Nenhuma movimentação registrada hoje ainda.</b></div>`;
  }else{
    for(const who of emps){
      const moves=byEmp[who].sort((a,b)=>a.time-b.time);
      const emp=employees().find(e=>{const c=onlyDigits(pick(e,SCHEMA.cpfFields));return c&&cpf11(c)===cpf11(who)});
      const label=emp?empName(emp):(who==="gestor"?"Gestor":who);
      body+=`<div class="diag" style="margin-bottom:10px"><h4>${esc(label)} <span class="count-pill">${moves.length}</span></h4>`;
      body+=moves.map(m=>`<div class="small" style="padding:5px 0;border-bottom:1px solid var(--line)">
        <b>${esc(m.label)}</b> — ${esc(m.title)}${esc(m.extra)}
        <span style="color:var(--muted-2)"> · ${new Date(m.time).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</span>
      </div>`).join("");
      body+=`</div>`;
    }
  }

  // tarefas "a executar" atualmente atrasadas (dias acumulados), por colaborador responsável
  const lateByEmp={};const lateUnassigned=[];
  for(const iid in INSTANCES){
    const ins=INSTANCES[iid];if(!ins||ins.date>=today)continue;
    if(ins.status!=="pendente"&&ins.status!=="em_andamento")continue;
    const task=TASKS[ins.taskId];if(!task||task.active===false)continue;
    const who=ins.assignedTo;
    const days=daysBetween(ins.date,today);
    if(!who){lateUnassigned.push({title:task.title,days,date:ins.date});continue}
    const nm=empName(employeeById(who))||"—";
    (lateByEmp[nm]=lateByEmp[nm]||[]).push({title:task.title,days});
  }
  const lateEmps=Object.keys(lateByEmp).sort((a,b)=>Math.max(...lateByEmp[b].map(x=>x.days))-Math.max(...lateByEmp[a].map(x=>x.days)));
  if(lateEmps.length){
    body+=`<div class="section-title">Tarefas em atraso (acumulado)</div>`;
    for(const nm of lateEmps){
      const items=lateByEmp[nm].sort((a,b)=>b.days-a.days);
      body+=`<div class="diag" style="margin-bottom:10px"><h4>${esc(nm)}</h4>`;
      body+=items.map(it=>`<div class="small" style="padding:4px 0;border-bottom:1px solid var(--line)">${esc(it.title)} <span class="chip late" style="margin-left:4px">${it.days} dia(s)</span></div>`).join("");
      body+=`</div>`;
    }
  }
  if(lateUnassigned.length){
    body+=`<div class="section-title">Sem responsável elegível (não chegaram a ninguém)</div>
      <p class="note" style="margin:-2px 2px 10px">Nenhum colaborador da fila estava presente/elegível nesses dias — ninguém recebeu a tarefa.</p>`;
    body+=`<div class="diag">`;
    body+=lateUnassigned.sort((a,b)=>b.days-a.days).map(it=>`<div class="small" style="padding:4px 0;border-bottom:1px solid var(--line)">${esc(it.title)} · ${esc(fmtDate(it.date))} <span class="chip late" style="margin-left:4px">${it.days} dia(s)</span></div>`).join("");
    body+=`</div>`;
  }

  openSheet("Relatório do dia",body+`<div class="sheet-actions"><button class="btn primary" data-act="close" style="flex:none;width:100%">Fechar</button></div>`);
}

    case"confirm-complete":{const note=$("#completeNote")?$("#completeNote").value:"";completeTask(iid,note);closeModal();break}
    case"open-notdone":openNotDoneModal(iid);break;
    case"confirm-notdone":{const note=$("#completeNote")?$("#completeNote").value:"";markNotDone(iid,note);closeModal();break}
    case"reopen":reopenTask(iid);closeModal();break;
    case"open-detail":openTaskDetail(iid);break;
    case"open-task-history":openTaskDetail(iid,{readOnly:true});break;
    case"toggle-check":{
      const itemId=a.dataset.item;
      const ins=INSTANCES[iid];if(!ins||!canAct(ins))break;
      ins.checklistState=ins.checklistState||{};
      const newVal=!(ins.checklistState[itemId]===true);
      ins.checklistState[itemId]=newVal; // otimista, antes do round-trip do Firebase
      dbRef(`${PATH.tarefas}/instances/${iid}/checklistState/${itemId}`).set(newVal);
      openTaskDetail(iid); // re-renderiza o modal já refletindo o novo estado
      break;
    }
    case"show-partner":openPartnerTasks(a.dataset.emp);break;
    case"show-coresp":openCorespModal();break;
    case"pull-task":pullTaskToMe(iid);break;
    case"show-coresp-future":openCorespFutureModal(a.dataset.date);break;
    case"set-mine-offset":state.mineOffset=+a.dataset.off;render();break;
    case"open-report":openDailyReport();break;
    case"goto-discussions":state.view="tickets";setActiveTab();render();break;
    case"open-discussion":openDiscussionThread(a.dataset.type,a.dataset.id);break;
    case"send-discussion-reply":{const txt=$("#discReply")?$("#discReply").value:"";addDiscussionMessage(a.dataset.type,a.dataset.id,txt);break}
    case"deactivate-discussion":markThreadInactive(a.dataset.type,a.dataset.id);break;
    case"reactivate-discussion":markThreadActiveManual(a.dataset.type,a.dataset.id);break;
    case"reopen-discussion":reopenDiscussionThread(a.dataset.type,a.dataset.id);break;
    case"edit-task-from-discussion":closeModal();openTaskForm(a.dataset.id);break;
    case"migrate-discussions":migrateTicketsToDiscussions();break;
    case"clean-bogus-backfill":cleanBogusBackfill();break;
    case"transfer":openTransfer(iid);break;
    case"sel-r":transferState.sel={type:"r",empId:a.dataset.to};renderTransfer();break;
    case"sel-day":transferState.sel={type:"day"};renderTransfer();setTimeout(()=>{const el=$("#postDate");if(el)el.focus()},0);break;
    case"confirm-transfer":{
      const ts=transferState;if(!ts||!ts.sel)break;
      if(ts.sel.type==="r")transferToR(ts.iid,ts.sel.empId);
      else{const d=($("#postDate")&&$("#postDate").value)||ts.date;postpone(ts.iid,d)}
      break;
    }
    // form
    case"combo-pick":{
      const combo=a.dataset.combo,value=a.dataset.value,label=a.dataset.comboname||"";
      const inp=document.getElementById(combo);
      const mode=inp?inp.dataset.combomode:"add";
      handleComboPick(combo,mode,value,label);
      break;
    }
    case"resp-rm":{formState.responsibles.splice(+a.dataset.i,1);refreshTaskResp();break}
    case"resp-up":{const i=+a.dataset.i;const r=formState.responsibles;[r[i-1],r[i]]=[r[i],r[i-1]];refreshTaskResp();break}
    case"resp-down":{const i=+a.dataset.i;const r=formState.responsibles;[r[i+1],r[i]]=[r[i],r[i+1]];refreshTaskResp();break}
    case"check-add":{
      const inp=$("#fAddCheck");const text=inp?inp.value.trim():"";
      if(text){formState.checklist.push({id:genId("chk"),text});refreshTaskChecklist()}
      break;
    }
    case"check-rm":{formState.checklist.splice(+a.dataset.i,1);refreshTaskChecklist();break}
    case"save-task":{
      syncFormInputs();const f=formState;
      if(!f.title.trim()){toast("Informe o título.");return}
      if(!f.responsibles.length){toast("Adicione ao menos um responsável.");return}
      saveTask(f,f.id);break;
    }
  }
});

/* selects de filtro do gestor */
document.addEventListener("change",e=>{
  const f=e.target.closest("[data-filter]");
  if(f){state.adminFilter[f.dataset.filter]=f.value;render();return}
  const f2=e.target.closest("[data-filter2]");
  if(f2){state.respFilter[f2.dataset.filter2]=f2.value;render();return}
  const f3=e.target.closest("[data-filter3]");
  if(f3){state.perfFilter[f3.dataset.filter3]=f3.value;render();return}
  const fos=e.target.closest("[data-filter-os]");
  if(fos){state.osFilter[fos.dataset.filterOs]=fos.value;render();return}
  const fdisc=e.target.closest("[data-filter-disc]");
  if(fdisc){state.discFilter=fdisc.value;render();return}
  const fteam=e.target.closest("[data-filter-team]");
  if(fteam){state.teamFilter[fteam.dataset.filterTeam]=fteam.value;render();return}
  if(e.target.id==="postDate"&&transferState){transferState.date=e.target.value}
  if(formState&&["fInterval","fMonthDay"].includes(e.target.id)){

    const prev=$("#fRecurPreview");if(prev)prev.textContent=recurrenceLabel(formState.recurrence);
  }
});

/* ===================================================================
   13) LISTENERS DE DADOS
   =================================================================== */
function afterData(){
  if(state.ready){materialize();render();}
}
if(FB_OK){
  dbRef(PATH.escala).on("value",s=>{
    const novo=s.val()||{};
    const novoN=toArray(novo.employees).length;
    const anteriorN=ESCALA?toArray(ESCALA.employees).length:0;
    // proteção contra snapshot parcial: se chegou com menos da metade dos funcionários que já tínhamos,
    // é muito provável que o app de escala estava no meio de uma escrita — ignora e aguarda o próximo evento
    if(anteriorN>0&&(novoN===0||novoN<anteriorN/2)){
      console.warn(`[escala] snapshot parcial ignorado: tinha ${anteriorN} colaboradores, chegou ${novoN} — aguardando próximo update`);
      return;
    }
    ESCALA=novo;
    const n=employees().length;
    $("#lgStatus").textContent=n?("Pronto. "+n+" colaboradores na escala."):"Nenhum colaborador encontrado na escala.";
    tryRestore();afterData();
  },err=>{
    $("#lgStatus").textContent="Erro ao ler a escala: "+err.code+". Verifique as regras do banco.";
  });
  dbRef(PATH.tarefas).on("value",s=>{
    const v=s.val()||{};
    const novasTasks=v.tasks||{}, novasInst=v.instances||{};
    // Proteção contra snapshot parcial (mesma lógica do listener da escala): se o nó voltou vazio
    // ou com muito menos dados do que já tínhamos, é quase certo que foi oscilação de conexão ou
    // escrita concorrente. Aceitar esse snapshot faria a materialização recriar como "pendente"
    // instâncias que já estavam concluídas — foi exatamente o bug de "tarefa fechada voltou a abrir".
    const tinhaTasks=Object.keys(TASKS).length, tinhaInst=Object.keys(INSTANCES).length;
    const vemTasks=Object.keys(novasTasks).length, vemInst=Object.keys(novasInst).length;
    if((tinhaTasks>0&&(vemTasks===0||vemTasks<tinhaTasks/2))||(tinhaInst>0&&(vemInst===0||vemInst<tinhaInst/2))){
      console.warn(`[tarefas] snapshot parcial ignorado: tarefas ${tinhaTasks}→${vemTasks}, instâncias ${tinhaInst}→${vemInst} — aguardando próximo update`);
      return;
    }
    TASKS=novasTasks;INSTANCES=novasInst;TICKETS=v.tickets||{};WEEKLY_SCORES=v.weeklyScores||{};
    SCORE_RESET_AT=v.scoreResetAt||null;SERVICE_ORDERS=v.serviceOrders||{};DISCUSSIONS=v.discussions||{};
    invalidateTerminalIndex();
    afterData();
  });

  /* usuários: opcional agora (login é por CPF). Mantido só para o Diagnóstico. */
  dbRef(PATH.users).once("value").then(s=>{USERS=s.val()||{}}).catch(()=>{USERS={}});

  /* sessão de gestor pode ser restaurada sem esperar a escala */
  tryRestore();
}else{
  $("#lgStatus").innerHTML="⚠️ Firebase não carregou — abra este arquivo no GitHub Pages (ou via servidor local) para conectar.";
  const errBox=$("#loginError");
  errBox.innerHTML="Sem conexão com o Firebase neste ambiente. O app funciona quando hospedado (GitHub Pages) ou servido por http local.";
  errBox.classList.remove("hidden");
}
</script>
