async function loadUsersList(){
  const list=document.getElementById('users-list');
  if(!list)return;
  try{
    const res=await fetch(`${FB_USERS}.json`);
    const data=res.ok?await res.json():null;
    if(!data||!Object.keys(data).length){
      list.innerHTML=`<div style="padding:32px;text-align:center;color:var(--muted)">Nenhum usuário cadastrado.</div>`;
      return;
    }
    list.innerHTML='';
    Object.values(data).sort((a,b)=>(a.username||'').localeCompare(b.username||'')).forEach(user=>{
      const funcao=user.funcao||'—';
      const item=document.createElement('div');
      item.className='emp-list-item';
      item.innerHTML=`
        <div class="emp-info">
          <div class="emp-list-name">${user.name||user.username}
            <span class="user-role-badge role-custom" style="background:var(--primary)">${funcao}</span>
          </div>
          <div class="emp-list-role" style="font-family:var(--font-mono)">@${user.username}</div>
        </div>
        <div class="action-btns">
          <button class="icon-btn" onclick="openUserModal('${user.username}')">${svgIcon(ICONS.edit,15)}</button>
          ${user.username!=='gestor'?`<button class="icon-btn red" onclick="deleteUser('${user.username}')">${svgIcon(ICONS.trash,15)}</button>`:''}
        </div>
      `;
      list.appendChild(item);
    });
  }catch(e){
    if(list)list.innerHTML=`<div style="padding:16px;color:var(--red)">Erro ao carregar usuários.</div>`;
  }
}

async function deleteUser(username){
  if(!confirm(`Remover o usuário @${username}?`))return;
  await fetch(`${FB_USERS}/${username}.json`,{method:'DELETE'});
  if(currentTab==='usuarios')render();
}

function openUserModal(username){
  if(username){
    fetch(`${FB_USERS}/${username}.json`).then(r=>r.json()).then(user=>{
      if(user)_showUserModal(username,user);
    });
  }else{
    _showUserModal(null,null);
  }
}

function _showUserModal(username, user){
  const editing=!!username;
  const allSectors=state.data.sectors.slice().sort((a,b)=>a.order-b.order);
  const userSectors=user?.sectors||'all';
  const userPerms=user?.perms||{};
  const funcaoOpts=FUNCOES.map(f=>`<option ${(user?.funcao||''===f)?'selected':''}>${f}</option>`).join('');

  // Build permission rows
  const permRows=SECOES.map(sec=>{
    const cur=userPerms[sec.key]||sec.opts[sec.opts.length-1];
    const opts=sec.opts.map(o=>`<option ${cur===o?'selected':''}>${o}</option>`).join('');
    return `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border-soft)">
        <span style="font-size:13px;font-weight:500">${sec.label}</span>
        <select id="perm-${sec.key}" class="input" style="width:auto;min-width:180px;height:34px;padding:4px 32px 4px 10px;font-size:13px">${opts}</select>
      </div>`;
  }).join('');

  const sectorsHtml=allSectors.map(s=>`
    <label class="perm-item">
      <input type="checkbox" id="sec-${s.id}" ${userSectors==='all'||userSectors.includes?.(s.id)?'checked':''}>
      <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.color}"></span>
      ${s.name}
    </label>`).join('');

  const html=`
    <div class="modal-header">
      <div class="modal-title">${editing?'Editar':'Novo'} usuário</div>
      <button class="close-btn" onclick="closeModal()">${svgIcon(ICONS.x)}</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px">
      <div class="field"><label class="label">Nome</label><input class="input" id="umod-name" value="${user?.name||''}"></div>
      <div class="field"><label class="label">Usuário (login)</label><input class="input" id="umod-user" value="${username||''}" ${editing?'readonly':''}></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div class="field"><label class="label">Senha${editing?' (em branco = manter)':''}</label><input class="input" type="password" id="umod-pass" placeholder="••••••••"></div>
      <div class="field"><label class="label">Função</label>
        <select class="input" id="umod-funcao">${funcaoOpts}</select>
      </div>
    </div>
    <div class="perm-section">
      <div class="perm-section-title">Permissões por área</div>
      ${permRows}
    </div>
    <div class="perm-section" style="margin-top:16px">
      <div class="perm-section-title">Setores visíveis</div>
      <label class="perm-item full-width" style="margin-bottom:8px">
        <input type="checkbox" id="sec-all" ${userSectors==='all'?'checked':''} onchange="toggleAllSectors(this.checked)">
        Todos os setores
      </label>
      <div class="perm-grid" id="sectors-checks">${sectorsHtml}</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveUser('${username||''}')">${svgIcon(ICONS.check)} Salvar</button>
    </div>
  `;
  openModal(html,true);
  // Disable sector checkboxes if "all" is checked
  setTimeout(()=>toggleAllSectors(userSectors==='all'),50);
}

function toggleAllSectors(checked){
  document.querySelectorAll('#sectors-checks input[type=checkbox]').forEach(cb=>{
    cb.checked=checked;cb.disabled=checked;
  });
}

async function saveUser(originalUsername){
  const name=document.getElementById('umod-name').value.trim();
  const username=document.getElementById('umod-user').value.trim().toLowerCase().replace(/\s+/g,'');
  const password=document.getElementById('umod-pass').value;
  const funcao=document.getElementById('umod-funcao').value;
  if(!name||!username){alert('Preencha nome e usuário.');return}

  const editing=!!originalUsername;
  let passwordHash;
  if(password){
    passwordHash=await hashPassword(password);
  }else if(editing){
    const res=await fetch(`${FB_USERS}/${originalUsername}.json`);
    const existing=await res.json();
    passwordHash=existing?.passwordHash;
  }else{
    alert('Defina uma senha.');return;
  }

  if(!editing){
    const check=await fetch(`${FB_USERS}/${username}.json`);
    const exists=await check.json();
    if(exists){alert(`Usuário @${username} já existe.`);return}
  }

  // Collect permissions from dropdowns
  const perms={};
  SECOES.forEach(sec=>{
    const el=document.getElementById(`perm-${sec.key}`);
    if(el)perms[sec.key]=el.value;
  });

  // Sectors
  const secAll=document.getElementById('sec-all');
  let sectors='all';
  if(!secAll?.checked){
    const arr=[];
    document.querySelectorAll('#sectors-checks input[type=checkbox]').forEach(cb=>{
      if(cb.checked&&cb.id.startsWith('sec-'))arr.push(cb.id.replace('sec-',''));
    });
    sectors=arr;
  }

  const user={name,username,funcao,passwordHash,sectors,perms};
  await fetch(`${FB_USERS}/${username}.json`,{
    method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(user)
  });
  closeModal();
  if(currentTab==='usuarios')render();
}

// ===================== LOG SYSTEM =====================
let _logSessionId = null;
let _logBuffer = [];
let _logFlushTimer = null;

function startLogSession(){
  if(!currentUser||currentUser.username==='preview')return;
  _logSessionId = `${fmtDate(new Date())}_${currentUser.username}_${Date.now()}`;
  _logBuffer = [];
  logAction('Entrou no sistema');
}

function logAction(action, detail=''){
  if(!_logSessionId||!currentUser||currentUser.username==='preview')return;
  const entry={
    t: Date.now(),
    action,
    detail: detail||'',
  };
  _logBuffer.push(entry);
  // Debounce flush to Firebase
  clearTimeout(_logFlushTimer);
  _logFlushTimer=setTimeout(flushLog, 1500);
}

async function flushLog(){
  if(!_logSessionId||!_logBuffer.length)return;
  try{
    const session={
      id: _logSessionId,
      username: currentUser.username,
      name: currentUser.name||currentUser.username,
      funcao: currentUser.funcao||'',
      startedAt: parseInt(_logSessionId.split('_').pop()),
      entries: [..._logBuffer],
    };
    await fetch(`${FB_LOGS}/${_logSessionId}.json`,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(session),
    });
  }catch(e){}
}

// Intercept key mutations to log them
const _origSetScheduleCell = setScheduleCell;

function fmtTime(ts){
  const d=new Date(ts);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

// ===================== LOGS PAGE =====================
let logsFilterDate = '';

function renderLogs(){
  const div=document.createElement('div');
  div.innerHTML=`
    <div class="page-header">
      <div><div class="page-title">Logs de Operações</div><div class="page-sub">Histórico de sessões e ações dos usuários</div></div>
      <div style="display:flex;align-items:center;gap:8px">
        <label class="label" style="margin:0">Data</label>
        <input type="date" id="logs-date" value="${logsFilterDate}" onchange="setLogsFilter(this.value)" style="padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface)">
        <button class="btn btn-ghost btn-sm" onclick="setLogsFilter('')">Limpar</button>
      </div>
    </div>
    <div id="logs-list">
      <div style="padding:40px;text-align:center;color:var(--muted)">🔄 Carregando logs…</div>
    </div>
  `;
  setTimeout(()=>loadLogs(),0);
  return div;
}

function setLogsFilter(val){
  logsFilterDate=val;
  render();
}

async function loadLogs(){
  const list=document.getElementById('logs-list');
  if(!list)return;
  try{
    const res=await fetch(`${FB_LOGS}.json`);
    const data=res.ok?await res.json():null;
    if(!data||!Object.keys(data).length){
      list.innerHTML=`<div style="padding:40px;text-align:center;color:var(--muted)"><div style="font-size:28px;margin-bottom:8px">📭</div>Nenhum log registrado ainda.</div>`;
      return;
    }
    let sessions=Object.values(data).sort((a,b)=>b.startedAt-a.startedAt);
    if(logsFilterDate){
      sessions=sessions.filter(s=>fmtDate(new Date(s.startedAt))===logsFilterDate);
    }
    if(!sessions.length){
      list.innerHTML=`<div style="padding:32px;text-align:center;color:var(--muted)">Nenhum log para a data selecionada.</div>`;
      return;
    }
    list.innerHTML='';
    sessions.forEach(session=>{
      const d=new Date(session.startedAt);
      const dateStr=`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
      const timeStr=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      const count=(session.entries||[]).length;

      const sessionEl=document.createElement('div');
      sessionEl.className='log-session';

      const header=document.createElement('div');
      header.className='log-session-header';
      header.innerHTML=`
        <div class="log-dot"></div>
        <div class="log-session-info">
          <div class="log-session-user">${session.name||session.username} <span style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">@${session.username}</span>
            ${session.funcao?`<span class="user-role-badge role-custom" style="background:var(--primary);margin-left:6px">${session.funcao}</span>`:''}
          </div>
          <div class="log-session-meta">${dateStr} às ${timeStr}</div>
        </div>
        <div class="log-session-count">${count} ação${count!==1?'ões':''}</div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted);transition:transform .2s"><path d="m6 9 6 6 6-6"/></svg>
      `;

      const entriesEl=document.createElement('div');
      entriesEl.className='log-entries';
      entriesEl.style.display='none';
      (session.entries||[]).forEach(entry=>{
        const row=document.createElement('div');
        row.className='log-entry';
        row.innerHTML=`
          <span class="log-entry-time">${fmtTime(entry.t)}</span>
          <span class="log-entry-action">${entry.action}${entry.detail?` <span class="log-entry-detail">— ${entry.detail}</span>`:''}</span>
        `;
        entriesEl.appendChild(row);
      });

      header.onclick=()=>{
        const open=entriesEl.style.display!=='none';
        entriesEl.style.display=open?'none':'block';
        header.classList.toggle('open',!open);
        const arrow=header.querySelector('svg');
        if(arrow)arrow.style.transform=open?'':'rotate(180deg)';
      };

      sessionEl.appendChild(header);
      sessionEl.appendChild(entriesEl);
      list.appendChild(sessionEl);
    });
  }catch(e){
    if(list)list.innerHTML=`<div style="padding:16px;color:var(--red)">Erro ao carregar logs: ${e.message}</div>`;
  }
}
